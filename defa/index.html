<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思想道德与法治 · 2026 期末题库</title>
<meta name="description" content="德法课全题库在线练习：单选、多选、判断、材料分析，含错项解析与艾宾浩斯复习计划。">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#EFEDE5; --surface:#FCFAF3; --surface-2:#F6F3EA;
  --ink:#16211E; --ink-2:#3F4C46; --muted:#77837C;
  --green:#1E5A47; --green-soft:#E3EDE6; --red:#A03A2A; --red-soft:#F4E4DF;
  --gold:#A9822F; --line:#DDD8C9; --shadow:0 1px 2px rgba(22,33,30,.06),0 12px 28px rgba(22,33,30,.06);
  --serif:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:inherit}

/* ===== 布局 ===== */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 20px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.wrap{width:min(880px,100%);margin:0 auto;padding:28px 24px 120px}

/* ===== 侧栏 ===== */
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.brand h1{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;letter-spacing:.02em}
.brand .tag{font-size:11px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.sub{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.6}

.today{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.today-top{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--green)}
.today-nums{font-size:12px;color:var(--ink-2);line-height:1.9}
.today-nums b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.today .streak{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
.streak .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}

.nav-title{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:20px 0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--green);color:#fff}
.nav button.on .cnt{color:rgba(255,255,255,.75)}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chapters button{padding:9px}
.chapters .mini{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.chapters .mini i{display:block;height:3px;background:var(--green);border-radius:2px;width:0}
.chapters button.on .mini{background:rgba(255,255,255,.25)}
.chapters button.on .mini i{background:#fff}

.rail-foot{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
.rail-foot button{background:none;border:0;color:var(--green);padding:0;text-decoration:underline;font-size:11px}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:20;background:rgba(239,237,229,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{width:min(880px,100%);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px}
.mode-pill{font-size:12px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px;color:var(--ink-2)}
.topbar .sp{flex:1}
.tb-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px}
.tb-btn:hover{border-color:var(--green);color:var(--green)}
.tb-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.only-mobile{display:none}

/* ===== 题目卡 ===== */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 26px 22px;position:relative}
.qmeta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:14px}
.qmeta .chip{background:var(--green-soft);color:var(--green);padding:2px 8px;border-radius:4px;letter-spacing:.08em}
.qmeta .chip.j{background:#EFE8D6;color:#7A5F1C}
.qmeta .chip.m{background:#E6E8F0;color:#3E4A6B}
.qmeta .chip.e{background:#F0E2DC;color:#8A4432}
.qmeta .no{font-family:var(--serif);font-size:13px;color:var(--ink)}
.stem{font-family:var(--serif);font-size:19px;line-height:1.85;margin:0 0 18px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover{border-color:#B9C7BD;background:#fff}
.opt .key{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink-2);margin-top:1px}
.opt .txt{flex:1;font-size:15px;line-height:1.65;color:var(--ink)}
.opt.sel{border-color:var(--green);background:#fff;box-shadow:inset 0 0 0 1px var(--green)}
.opt.sel .key{background:var(--green);color:#fff;border-color:var(--green)}
.opt.right{border-color:var(--green);background:#F1F7F1}
.opt.right .key{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .key{background:var(--red);color:#fff;border-color:var(--red)}
.opt.missed{border-style:dashed;border-color:var(--green)}
.opt.missed .key{border-color:var(--green);color:var(--green)}
.opt .flag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;align-self:center}

.truefalse{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.tf{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:22px 10px;font-family:var(--serif);font-size:20px;letter-spacing:.1em}
.tf:hover{border-color:var(--green)}
.tf.sel{border-color:var(--green);background:#fff;box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}
.tf.right{border-color:var(--green);background:#F1F7F1;color:var(--green)}
.tf.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}

.verdict{margin-top:18px;border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.verdict.ok{background:var(--green-soft);border:1px solid #C7DACC;color:#14483A}
.verdict.no{background:var(--red-soft);border:1px solid #E3C6BE;color:#7C2C1F}
.verdict .mark{font-family:var(--serif);font-weight:700;font-size:16px}
.verdict .body{flex:1}
.verdict .ans{font-family:var(--serif);letter-spacing:.12em;font-weight:700}

.analysis{margin-top:12px;border-top:1px dashed var(--line);padding-top:14px;font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.analysis .lab{display:inline-block;font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.analysis .exp{background:var(--surface-2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:8px;line-height:1.75}
.keypoints{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.keypoints .lab{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.keypoints ul{margin:8px 0 0;padding-left:18px}
.keypoints li{margin-bottom:7px;font-size:14px;line-height:1.7;color:var(--ink-2)}
.selfcheck{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 16px;font-size:14px}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#17493A;color:#fff}
.btn.primary:disabled{background:#9DB3A7;border-color:#9DB3A7;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:12px}

/* ===== 底部作答栏 ===== */
.dock{position:sticky;bottom:0;background:rgba(252,250,243,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:18}
.dock-in{width:min(880px,100%);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:10px}
.dock .prog{flex:1;font-size:12px;color:var(--muted)}
.dock .prog .bar{height:4px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.dock .prog .bar i{display:block;height:4px;background:var(--green);width:0}
.tools{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{border-color:var(--green);color:var(--green)}
.icon-btn.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}

/* ===== 答题卡抽屉 ===== */
.sheet-mask{position:fixed;inset:0;background:rgba(22,33,30,.32);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--surface);z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet.on{transform:none}
.sheet-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.sheet-head h3{font-family:var(--serif);font-size:16px;margin:0}
.sheet-body{overflow-y:auto;padding:16px 20px 30px}
.sheet-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.sheet-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.grid button{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.grid button.done{background:var(--green-soft);border-color:#BBD2C1;color:#17503E}
.grid button.bad{background:var(--red-soft);border-color:#E2C3BA;color:var(--red)}
.grid button.cur{outline:2px solid var(--green);outline-offset:1px}

/* ===== 统计视图 ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .k{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:4px}
.stat .s{font-size:11px;color:var(--muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.panel h3{font-family:var(--serif);font-size:15px;margin:0 0 14px;font-weight:700}
.rowbar{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:12px;color:var(--ink-2);margin-bottom:9px}
.rowbar .t{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.rowbar .t i{display:block;height:100%;background:var(--green)}
.rowbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stage-chip{flex:1;min-width:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}
.stage-chip b{display:block;font-family:var(--serif);font-size:18px}
.stage-chip span{font-size:10px;color:var(--muted)}
.plan-table{width:100%;border-collapse:collapse;font-size:12px}
.plan-table th,.plan-table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.plan-table th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.06em}
.plan-table td.n{font-variant-numeric:tabular-nums}

.note{font-size:12px;color:var(--muted);line-height:1.8;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}

/* 空态 */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:48px 24px;text-align:center}
.empty h2{font-family:var(--serif);font-size:20px;margin:0 0 8px}
.empty p{color:var(--muted);font-size:13px;margin:0 0 18px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;height:100%;width:290px;z-index:45;transform:translateX(-102%);transition:transform .22s}
  .rail.on{transform:none}
  .wrap{padding:20px 16px 120px}
  .topbar-in{padding:10px 14px}
  .only-mobile{display:inline-flex}
  .stem{font-size:17px}
  .qcard{padding:20px 16px}
  .dock-in{padding:10px 14px}
}

.nav button:disabled,.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.chapters button{flex-wrap:wrap}
.chapters button > span:first-child{flex:1;text-align:left}
.chapters .mini{flex-basis:100%}

</style>

    <div class="today">

      <button onclick="App.exportData()">导出学习进度</button> ｜ <button onclick="App.resetAll()">清空记录</button>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-in">
        <button class="tb-btn only-mobile" onclick="App.toggleRail()">章节</button>

        <button class="tb-btn" onclick="App.openSheet()">答题卡</button>
      </div>

    <div id="practiceView">
      <div class="wrap"><div id="qbox"></div></div>

          <div class="prog" id="dockProg"></div>

            <button class="icon-btn" id="btnPrev" onclick="App.prev()" title="上一题">←</button>

          <button class="btn small" onclick="App.goPractice()">← 返回练习</button>

</div>

<div id="toast" style="position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);background:#16211E;color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:60"></div>

"强化自我修养，坚守道德底线","追求物质享受，放松自我要求","依赖外部监督，放弃自我管理"],"a":"B"},{"ch":1,"t":"s","n":45,"stem":"纪念中国人民抗日战争暨世界反法西斯战争胜利 80 周年大会的目的是铭记历史、缅怀先烈、珍爱和平、开创未来。这体现了我们应秉持（ ）的人生态度。","o":["忘却历史，只关注当下利益","沉迷过去，陷入历史仇恨无法自拔","尊重历史，以史为鉴，积极开创美好未来","漠视和平，崇尚武力解决问题"],"a":"C"},{"ch":1,"t":"s","n":46,"stem":"习近平总书记在纪念中国人民抗日战争暨世界反法西斯战争胜利 80 周年大会上强调，中华民族是不畏强暴、自立自强的伟大民族。这启示我们应树立（ ）的人生观。","o":["贪图享乐，追求个人安逸","独立自主，勇于面对困难挑战，为国家和民族奋斗","自私自利，只考虑个人利益","随波逐流，缺乏坚定信念和目标"],"a":"B"},{"ch":1,"t":"m","n":1,"stem":"评价人生价值的方法有（ ）？","o":["要坚持从社会客观条件出发","既要看贡献的大小，也要看尽力的程度","既要尊重物质贡献，也要尊重精神贡献","既要注重社会贡献，也要注重自身完善","以社会价值的实现为唯一评价方法"],"a":"BCD","e":"A项：“从社会客观条件出发”是实现人生价值的条件，不是评价方法；E项“唯一评价方法”表述绝对化。"},{"ch":1,"t":"m","n":2,"stem":"以下关于人生价值的论述正确的是（ ）？","o":["人生价值内在地包含了人生的自我价值和社会价值两个方面","人生价值选择将决定人生的目的","人生的自我价值是个体生存和发展的必要条件","人生的社会价值是社会存在和发展的重要条件","既要注重社会贡献，又要注重自身完善"],"a":"ACDE","e":"B项：因果颠倒，是人生目的决定人生价值选择，而非价值选择决定人生目的。"},{"ch":1,"t":"m","n":3,"stem":"以下关于“人生目的”、“人生态度”、“人生价值”三者关系的表述正确的是（ ）?","o":["人生目的决定着人们对待实际生活的态度和人生价值的评判","人生态度影响着人们对人生目的的持守和人生价值的实现","人生价值制约着人生目的和人生态度的选择","三者之间相互联系、相辅相成，统一为一个有机整体","三者之间没有必然的联系"],"a":"ABCD","e":"E项：三者相互联系、相辅相成，说“没有必然联系”错误。"},{"ch":1,"t":"m","n":4,"stem":"大学生要科学认识实际生活中的各种问题，勇敢面对和正确处理各种人生矛盾就应做到（ ）。","o":["树立正确的得失观","树立正确的生死观","树立正确的顺逆观","树立正确的荣辱观","以上表述都不正确"],"a":"ABCD","e":"E项：四项（得失观、生死观、顺逆观、荣辱观）均为正确表述，故E错误。"},{"ch":1,"t":"m","n":5,"stem":"现实生活中，由于多元价值观的存在，不同的人有着不同的人生价值目标，下列人生价值目标中，符合我国现阶段社会主导价值观的有（ ）。","o":["全心全意为人民服务","自愿选择到祖国最需要的地方建功立业","为追求个人利益而不惜损害国家、集体和他人的利益","只满足于个人的需要和享乐"],"a":"AB","e":"C项：损害国家、集体和他人利益违背集体主义；D项：只求个人需要和享乐是享乐主义，均不符合主导价值观。"},{"ch":1,"t":"m","n":6,"stem":"树立积极进取的人生态度，能够（ ）","o":["调整人生道路的方向","有助于人生价值的实现","促进人生目的的达到","使人总是处在顺境当中"],"a":"ABC","e":"D项：积极进取的人生态度不能保证“总是处在顺境”，顺逆境取决于客观条件。"},{"ch":1,"t":"m","n":7,"stem":"当前社会上存在各种各样形形色色的人生观，其中错误的人生观主要有（ ）。","o":["拜金主义的人生观","享乐主义的人生观","消费主义的人生观","极端个人主义的人生观"],"a":"ABCD","e":"四项均属教材所列错误人生观，本题为全选题。"},{"ch":1,"t":"m","n":8,"stem":"关于顺境和逆境的利弊的理解，正确的是（ ）。","o":["顺境对人的发展有利也有弊","逆境对人的发展有利也有弊","顺境对人的发展有利无弊","逆境对人的发展有弊无利","以上表述都不正确"],"a":"AB","e":"C、D项：把顺境说成“有利无弊”、逆境“有弊无利”，都是绝对化错误。"},{"ch":1,"t":"m","n":9,"stem":"党的二十大报告强调“为民造福是立党为公、执政为民的本质要求”，倡导以人民为中心的价值追求。下列属于报告所倡导的人生观内涵的有（ ）","o":["服务人民，将个人价值融入民族复兴事业","奉献社会，践行“为人民服务、为社会主义服务”宗旨","个人利益至上，追求物质享受最大化","以国家需求为导向，在奋斗中实现人生意义"],"a":"ABD","e":"C项：“个人利益至上、追求物质享受最大化”是享乐主义和极端个人主义，与以人民为中心的价值追求相反。"},{"ch":1,"t":"m","n":10,"stem":"端正人生态度应该做到（ ）。","o":["人生须认真","人生当务实","人生应乐观","人生要进取","创新精神"],"a":"ABCD","e":"E项：“创新精神”不属于端正人生态度的四个方面（认真、务实、乐观、进取）。"},{"ch":1,"t":"m","n":11,"stem":"关于个人与社会的关系的理解，正确的是（ ）。","o":["在社会主义社会中，个人利益与社会利益在根本上是一致的","社会利益离不开个人利益，个人利益也离不开社会利益","社会利益不是个人利益的简单相加，而是所有人利益的有机统一","社会利益体现了作为社会成员的个人的根本利益和长远利益,是个人利益得以实现的前提和基础","竞争与合作的关系"],"a":"ABCD","e":"E项：竞争与合作是人际关系的一对范畴，不是个人与社会关系的表述，答非所问。"},{"ch":1,"t":"m","n":12,"stem":"下面关于社会价值正确的说法是（ ）。","o":["社会价值是社会和他人对于个体的意义","社会价值主要通过劳动、创造和贡献表现出来","社会价值是个体的人生对于社会和他人的意义","对社会贡献得越多，其人生价值就越大","以上表述都不正确"],"a":"BCD","e":"A项：把定义弄反了，“社会和他人的意义”指向个体的是自我价值，社会价值才是个体对社会的意义。"},{"ch":1,"t":"m","n":13,"stem":"人生目的的作用有（ ）。","o":["决定走什么样的人生道路","决定会有什么样的文化水平","决定持什么样的人生态度","决定人生价值选择","以上表述都不正确"],"a":"ACD","e":"B项：人生目的不决定文化水平，它决定人生道路、人生态度和人生价值选择。"},{"ch":1,"t":"m","n":14,"stem":"关于生死观的理解，正确的是（ ）。","o":["有生必有死，这是恒常不变的自然现象","每个人只有一次生命，人生弥足珍贵","人们无法增加生命的长度，但却能追求生命应有的高度","大学生应珍惜韶华，在服务人民、奉献社会的奋斗中挖掘生命的巨大潜能","以上表述都正确"],"a":"ABCDE","e":"五项均正确，本题为全选题。"},{"ch":1,"t":"m","n":15,"stem":"当代大学生担当新时代赋予的历史责任，在服务人民、奉献社会的实践中创造有意义的人生时，应当做到：（ ）。","o":["与历史同向","与祖国同行","与人民同在","与大学同行","以上表述都不正确"],"a":"ABC","e":"D项：“与大学同行”是生造表述；E项与正确选项矛盾。"},{"ch":1,"t":"m","n":16,"stem":"关于苦与乐的关系的理解，正确的是（ ）。","o":["苦与乐既对立又统一，在一定条件下可以相互转化","真正的快乐往往由奋斗的艰苦转化而来","争做迎难而上、艰苦奋斗的开拓者","苦不能转化为乐，乐也不能转化为苦","以上表述都不正确"],"a":"ABC","e":"D项：苦与乐在一定条件下可以相互转化，说“不能转化”错误。"},{"ch":1,"t":"m","n":17,"stem":"拜金主义、享乐主义、极端个人主义的人生观之所以错误，就在于它们（ ）。","o":["否定了人的主观能动性","片面强调了个人的需要和享乐","忽视了个人对社会的责任和贡献","没能准确地把握个人与社会的关系","以上表述都不正确"],"a":"BCD","e":"A项：这三种错误人生观并不否定人的主观能动性，其要害是颠倒个人与社会关系、只讲索取不讲贡献。"},{"ch":1,"t":"m","n":18,"stem":"人生观是人们对人生目的和人生意义的根本看法和态度。下列选项属于人生观范畴的有（ ）。","o":["人为什么活着","怎样生活才有价值","人类社会的发展规律是什么","如何对待人生道路上的困难和矛盾","以上表述都不正确"],"a":"ABD","e":"C项：“人类社会的发展规律”属于世界观、社会历史观范畴，不是人生观。"},{"ch":1,"t":"m","n":19,"stem":"任何人都只能在一定的主客观条件下去实现自己的人生价值。因此，大学生在追求人生价值实现时应坚持：（ ）。","o":["从社会客观条件出发","从个体自身条件出发","不断增强实现人生价值的能力和本领","人定胜天，只要努力一切皆有可能","以上表述都不正确"],"a":"ABC","e":"D项：“人定胜天、只要努力一切皆有可能”忽视客观条件，属于主观唯心主义的绝对化表述。"},{"ch":1,"t":"m","n":20,"stem":"关于人生的自我价值和社会价值的关系的理解，正确的是（ ）。","o":["人生的自我价值的实现是个体为社会创造更大价值的前提","人生社会价值的实现是个体自我完善、全面发展的保障","没有社会价值，人生的自我价值就无法存在","人生的自我价值和社会价值没有联系","以上表述都不正确"],"a":"ABC","e":"D项：自我价值与社会价值相互依存，说“没有联系”错误。"},{"ch":1,"t":"m","n":21,"stem":"下面对人生价值评价的说法中，正确的有（ ）。","o":["一个人的实践活动是否符合社会发展的客观规律是评价人生价值的根本尺度","个人为社会提供的物质财富是对人生价值进行评价的唯一标准","评价人生价值时，既要看动机，也要看效果，更重要的是看效果","个人能力强实现的人生价值一定要比个人能力弱实现的人生价值大","尽管个人能力有大小，但只要为社会为人民尽职尽责，做出了应有贡献，都是有价值的"],"a":"AE","e":"B项：物质财富不是唯一标准，还要看精神贡献；C项：教材主张动机与效果相统一，不能“更重要地看效果”；D项：能力大小与价值大小不能简单等同。"},{"ch":1,"t":"m","n":22,"stem":"正确认识人生矛盾，就要树立正确的得失观、幸福观、生死观。大学生要以积极的心态面对人生得失，必须做到（ ）。","o":["不要惧怕一时的失去","不要满足一时的得到","不要拘泥于个人利益的得失","敢于失去","勇于争取"],"a":"ABCE","e":"D项：“敢于失去”表述不当，教材要求“不要惧怕一时的失去”，而非鼓励主动失去。"},{"ch":1,"t":"m","n":23,"stem":"世界观与人生观的关系是（ ）。","o":["一个人的人生观总是以其世界观为根据，受到其世界观的制约和影响","世界观决定人生观","人生观对世界观的巩固、发展和变化起着重要作用","树立正确的人生观离不开马克思主义科学世界观的指导。","具有唯心主义世界观，人生观不一定就完全不正确"],"a":"ABCD","e":"E项：世界观决定人生观，唯心主义世界观下的人生观不可能完全正确，该表述错误。"},{"ch":1,"t":"m","n":24,"stem":"下面关于“人生态度”的表述正确的是（ ）","o":["人生态度是人生观的主要内容","人生态度是人生观的重要内容","人生态度决定人生观","人生态度是人生观的表现和反映","人生观决定人生态度"],"a":"BDE","e":"A项：人生态度是人生观的重要组成部分，不是“主要内容”的完整表述；C项：人生态度不能决定人生观，是人生观的表现和反映。"},{"ch":1,"t":"m","n":25,"stem":"下面关于“人生目的”与“人生价值”关系表述正确的是（ ）","o":["人生目的决定人生价值选择","人生价值选择决定人生目的","正确的人生目的会使人懂得人生的价值首先在于奉献","错误的人生目的则会使人把人生价值理解为向他人进行索取","人生目的与人生价值之间没有必然的联系"],"a":"ACD","e":"B项：因果颠倒，人生目的决定人生价值选择；E项：二者存在内在联系，说“没有必然联系”错误。"},{"ch":1,"t":"m","n":26,"stem":"关于“人生目的”，下面表述述正确的是（ ） ？","o":["人生目的决定人生态度","人生态度决定人生目的","人生目的决定人生价值选择","人生目的是人生观的核心","人生目是对“人为什么活着”这一人生根本问题的认识和回答"],"a":"ACDE","e":"B项：因果颠倒，人生目的决定人生态度，而非相反。"},{"ch":1,"t":"m","n":27,"stem":"下列哪些关系属于“社会关系”的范畴？（ ）","o":["业源关系","经济关系","道德关系","法律关系","家庭关系"],"a":"ABCDE","e":"五项均属社会关系范畴，本题为全选题。"},{"ch":1,"t":"m","n":28,"stem":"习近平同青年大学生座谈时强调：要树立正确的（ ），掌握了这把总钥匙，再来看看社会万象、人生历程，一切是非、正误、主次，一切真假、善恶、美丑，自然就洞若观火、清澈明了，自然就能作出正确判断、作出正确选择。","o":["社会主义核心价值观","世界观","价值观","人生观","道德观"],"a":"BCD","e":"A、E项：习近平总书记要求树立正确的世界观、人生观、价值观“总钥匙”，社会主义核心价值观、道德观不在其列。"},{"ch":1,"t":"m","n":29,"stem":"实现人生价值需要满足以下 哪些条件？（ ）","o":["实现人生价值要从社会客观条件出发","实现人生价值要从个体自身条件出发","不断增强实现人生价值的能力和本领","实现人生价值要多对社会做贡献","需要坚持集体主义"],"a":"ABC","e":"D项：表述不准确，应为在实践中创造和贡献，而非“多对社会做贡献”的口号式说法；E项：坚持集体主义不是实现人生价值的三项条件之一。"},{"ch":1,"t":"m","n":30,"stem":"人生观的主要内容包括（ ） 。","o":["人生目的","人生态度","为人民服务","人生价值","奉献社会"],"a":"ABD","e":"C、E项：“为人民服务”“奉献社会”属于道德核心和道德原则，不是人生观的三项内容（人生目的、人生态度、人生价值）。"},{"ch":1,"t":"m","n":31,"stem":"二十大报告寄语青年“立志做有理想、敢担当、能吃苦、肯奋斗的新时代好青年”，并倡导全社会弘扬奋斗精神。下列属于报告所倡导的人生态度的有（ ）","o":["艰苦奋斗，保持“谦虚谨慎、不骄不躁”的作风","开拓创新，践行“创造性转化、创新性发展”要求","消极懈怠，满足于现有成就不思进取","求真务实，在实践中锤炼 “能吃苦、肯奋斗” 的品质"],"a":"ABD","e":"C项：“消极懈怠、满足现状不思进取”与奋斗精神背道而驰。"},{"ch":1,"t":"m","n":32,"stem":"党的二十届三中全会强调“坚持以人民为中心，做到改革为了人民、改革依靠人民、改革成果由人民共享”，并将“完善城乡融合发展体制机制”列为重大改革任务。下列属于全会所倡导的人生观内涵的有（ ）","o":["积极参与基层民主实践，在社区治理中践行全过程人民民主","扎根乡村振兴一线，通过技术帮扶带动农民增收致富","把解决群众急难愁盼问题作为人生追求，在民生服务中实现价值","秉持“精英主义”理念，认为个人成功与普通群众利益无关"],"a":"ABC","e":"D项：“精英主义”“个人成功与群众利益无关”背离以人民为中心，属于错误人生观。"},{"ch":1,"t":"j","n":1,"stem":"社会需要是个人需要的集中体现，是社会全体成员带有根本性、全局性、长远性需要的反映。","a":"T"},{"ch":1,"t":"j","n":2,"stem":"一个人从来到人世的那天起，就从属于一定的社会群体。","a":"T"},{"ch":1,"t":"j","n":3,"stem":"没有社会价值，人生的自我价值也可存在。","a":"F"},{"ch":1,"t":"j","n":4,"stem":"一个人确立了服务人民、奉献社会的人生追求，才能清楚地把握人的生命历程和奋斗目标，深刻理解人为了什么而活、应走什么样的人生之路等道理。","a":"T"},{"ch":1,"t":"j","n":5,"stem":"只有在实践中才能创造有价值的人生。","a":"T"},{"ch":1,"t":"j","n":6,"stem":"个人的需要和社会的需要没有统一性。","a":"F"},{"ch":1,"t":"j","n":7,"stem":"评价人生价值的根本尺度就是看一个人的实践活动是否符合社会发展的客观规律，是否促进了历史的进步。","a":"T"},{"ch":1,"t":"j","n":8,"stem":"失恋后“看破红尘”是成熟的表现，是现实的人生态度。","a":"F"},{"ch":1,"t":"j","n":9,"stem":"价值观是人们关于什么是价值、怎样评判价值、如何创造价值等问题的根本观点。","a":"T"},{"ch":1,"t":"j","n":10,"stem":"人民群众是历史的创造者，是国家的主人。","a":"T"},{"ch":1,"t":"j","n":11,"stem":"个人利益的得失只能部分地衡量人生价值的大小，在奉献社会中才能实现更大的人生价值。","a":"T"},{"ch":1,"t":"j","n":12,"stem":"我们要坚决反对享乐主义，但是并不反对人们在辛勤劳动之后适度享受生活。","a":"T"},{"ch":1,"t":"j","n":13,"stem":"人生的价值同时表现为两个方面，一方面表现为个人对社会和他人的责任、义务和奉献，另一方面，表现为个人从社会和他人那里得到尊重和各种需要的满足。","a":"T"},{"ch":1,"t":"j","n":14,"stem":"当代大学生的人生价值观应与社会主义核心价值观相一致。","a":"T"},{"ch":1,"t":"j","n":15,"stem":"个人与社会的关系，归根结底是个人利益与社会利益的关系。","a":"T"},{"ch":1,"t":"j","n":16,"stem":"只有顺境才有利于人的进步与发展，逆境始终不利于人的发展。","a":"F"},{"ch":1,"t":"j","n":17,"stem":"尊重自己就是把满足个人自身的需要作为最终目的。","a":"F"},{"ch":1,"t":"j","n":18,"stem":"人生价值评价的基本标准是劳动和贡献。","a":"T"},{"ch":1,"t":"j","n":19,"stem":"世界观决定人生观，人生观从属于世界观。","a":"T"},{"ch":1,"t":"j","n":20,"stem":"个人拥有金钱的多少不能作为衡量人生价值的标准。","a":"T"},{"ch":1,"t":"j","n":21,"stem":"人生的自我价值能否实现与社会价值没有任何关系。","a":"F"},{"ch":1,"t":"j","n":22,"stem":"人生的社会价值是社会生存发展的重要条件。","a":"T"},{"ch":1,"t":"j","n":23,"stem":"人生的自我价值是个体生存发展的必要条件。","a":"T"},{"ch":1,"t":"j","n":24,"stem":"人生价值制约着人生目的和人生态度的选择。","a":"T"},{"ch":1,"t":"j","n":25,"stem":"一个人对自己个体物质和精神需要以怎样的方式和在多大程度上得到满足与社会没有关系。","a":"F"},{"ch":1,"t":"j","n":26,"stem":"个体的人生活动只需要具有满足自我需要的价值属性即可，没必要具有满足社会需要的价值属性。","a":"F"},{"ch":1,"t":"j","n":27,"stem":"认识人的本质，只能立足于具体的、历史的社会关系中从事社会实践的人，而不能从抽象的人性论出发。","a":"T"},{"ch":1,"t":"e","n":1,"stem":"某高校化工学院大三学生小林近期陷入多重困惑：​\n专业学习上，小林原本对化学专业有浓厚兴趣，曾计划考研深造，但看到身边同学大多选择跨考计算机、金融等“热门专业”，且家人多次强调“化学就业面窄、赚钱少”，他开始动摇，甚至怀疑自己的专业选择“是否太不切实际”；\n社会实践中，小林加入了学校“乡村文化调研社”，原本希望通过实地走访记录乡村非遗文化，但调研过程中，部分同学为“快速出成果”，存在编造调研数据、照搬网络资料的情况，小林多次提醒却被反驳“大家都这么做，认真你就输了”，他陷入“坚守诚信还是随波逐流”的纠结；​\n个人生活里，小林发现自己每天花费大量时间刷短视频、逛社交平台，看似“充实”，实则常常感到空虚，对比身边有人专注科研发表论文、有人积极参与志愿服务获得认可，他愈发迷茫“自己的人生价值到底该如何实现”。结合《思想道德与法治》第一章 “领悟人生真谛 把握人生方向”的相关内容（如人生目的、人生态度、人生价值、科学对待人生环境等），回答下列问题：​\n1、从“人生目的与人生道路选择”的关系角度，分析小林在专业选择上的困惑，说明大学生应如何树立正确的专业选择观，避免被“热门”、“功利”等因素误导？​\n2、材料中小林面临的“诚信困境”，本质上是人生态度的选择问题。请结合教材中“积极进取的人生态度”的要求，谈谈大学生在社会实践中应如何坚守诚信原则，抵制“投机取巧”的不良风气？​\n针对小林“人生价值迷茫”的问题，运用“人生价值的评价与实现”相关理论，说明大学生应如何摆脱“虚拟社交依赖”，在现实生活中创造有意义的人生价值？​","k":["理论依据：人生目的决定人生道路；选择人生道路要兼顾个人兴趣、专业优势与社会需要，而非追逐“热门”“功利”。","对小林的分析：因“热门专业”“家人功利化建议”而动摇，本质是人生目的不清，混淆了“专业热度”与“人生价值实现”。","正确专业选择观：①立足兴趣与特长，明确“为何选择专业”；②理性看待热门，热门≠适合；③主动与家人沟通专业理想与规划。","诚信困境：积极进取的人生态度要求认真、务实、诚信、坚毅；编造数据、抄袭资料虽能短期获利，却损害信誉。","做法：明确诚信是立身之本；以提出合理调研方案、分享真实方法引导团队，而非消极妥协；以长远眼光看待社会实践。","价值迷茫：人生价值评价的根本尺度是对社会的贡献，价值在劳动和实践中创造，虚拟社交只能带来“虚假充实”。","实现路径：树立社会价值优先观念；制定现实目标清单（读书笔记、公益活动）；以具体行动替代刷屏式消遣。"]},{"ch":2,"t":"s","n":1,"stem":"以下关于理想与空想的说法，正确的是（ ）。","o":["理想如果是实现不了的，那就是空想","空想具有超前性就等同于理想","只要信念坚定，空想照样可以实现","理想经过长期努力可以实现，而空想不能"],"a":"D"},{"ch":2,"t":"s","n":2,"stem":"爱因斯坦曾经说过：“每个人都有一定的理想，这种理想决定着他的努力和判断的方向。就在这个意义上，我从来不把安逸和快乐看作是生活目的本身——这种伦理基础我叫它猪栏的理想。”这段话凸显了（ ）。","o":["理想不仅具有现实性而且具有预见性","理想具有时代性和阶级性","理想具有实践性和实现可能性","理想源于现实又超越现实"],"a":"A"},{"ch":2,"t":"s","n":3,"stem":"理想是多方面和多类型的，从不同的角度审视，可以把理想划分为多种类型。从理想的主体上划分，理想有（ ）。","o":["科学理想和非科学理想","长远理想和近期理想","个人理想和社会理想","政治理想和道德理想"],"a":"C"},{"ch":2,"t":"s","n":4,"stem":"解决人生目的和奋斗目标的问题，最根本是要靠（ ）。","o":["理想信念","文化素质","法制教育","社会舆论"],"a":"A"},{"ch":2,"t":"s","n":5,"stem":"理想是人们在社会实践中形成的、有可能实现的、对未来社会和自身发展的向往与追求，是人们的世界观、人生观和价值观在奋斗目标上的集中体现。而空想是脱离实际的主观臆想，没有实现的可能性。由此可见，理想和空想的本质区别在于（ ）。","o":["理想具有实现的可能性","是否符合事物客观必然性的运动趋势","理想是人类特有的一种精神现象","理想具有超越现实性"],"a":"B"},{"ch":2,"t":"s","n":6,"stem":"理想和现实是一对矛盾，它们之间的关系既对立又统一。理想和现实的统一性表现在（ ）。","o":["理想源于现实，在将来又会变成新的现实","理想等同于现实，是可以立即实现的","理想是对现实随心所欲的想象","理想是完美的，现实是有缺陷的"],"a":"A"},{"ch":2,"t":"s","n":7,"stem":"如果用理想的标准来衡量现实，当人们发现现实和理想相差甚远时，就对现实大失所望，甚至极为不满，采取完全否定的态度。这种错误认识是陷入（ ）的片面性误区而生成。","o":["以理想来否定现实","以现实来否定理想","把理想等同于现实","把现实等同于理想"],"a":"A"},{"ch":2,"t":"s","n":8,"stem":"理想信念是在实践中形成的，也只有在实践中才能实现。看一个人是不是真有理想，主要是看他（ ）。","o":["在主观上是否有美好的愿望","想得是否很美妙","说得是否很动听","在行动上是否能为追求理想而奋斗"],"a":"D"},{"ch":2,"t":"s","n":9,"stem":"理想是人们在实践中形成的对未来社会和自身发展目标的向往与追求，其本质特征是（ ）","o":["脱离现实的完美设想","具有实现可能性的奋斗目标","纯粹主观的情感寄托","永恒不变的价值判断"],"a":"B"},{"ch":2,"t":"s","n":10,"stem":"习近平总书记指出：\"理想信念就是共产党人精神上的 ' 钙'\"，这强调了理想信念具有（ ）","o":["思想引导作用","道德规范作用","精神支撑作用","法律约束作用"],"a":"C"},{"ch":2,"t":"s","n":11,"stem":"习近平总书记指出：中国共产党成立以来，共产主义远大理想激励了一代又一代共产党人英勇奋斗，成千上万的烈士为了这个理想献出了宝贵生命。理想之所以美好，理想之所以令人向往，是因为理想在现实中产生，但它不是对现状的简单描绘，而是与奋斗目标相联 劳动，要靠实实在在的实践","理想具有时代性"],"a":"BCD","e":"A项：讲的是科学知识的来源，与“理想需要实践实现”无关；E项：理想的时代性同样不是本句所指。"},{"ch":2,"t":"m","n":30,"stem":"下面关于信仰信念信心的说法中，正确的有( )。","o":["学史增信，就是要增强信仰信念和信心，这是我们战胜一切强敌的强大精神力量。","当代大学生肩负重任，应当切实增强对马克思主义的信仰。","中国特色社会主义是历史发展的必然结果，必须坚定不移地坚持走下去。","只要拥有信心，中华民族的伟大复兴轻轻松松、敲锣打鼓就能实现。"],"a":"ABC","e":"D项：民族复兴要靠实干奋斗，“敲锣打鼓就能实现”是错误表述。"},{"ch":2,"t":"m","n":31,"stem":"中国特色社会主义共同理想是社会主义核心价值体系的主题。要求大学生( )。","o":["坚定对中国共产党的信任","坚定中国特色社会主义信念","坚定实现中华民族伟大复兴的信心","坚定马克思主义科学信仰","坚信理想与现实是对立的"],"a":"ABCD","e":"E项：理想信念与现实是辩证统一的，说“理想与现实对立”错误。"},{"ch":2,"t":"m","n":32,"stem":"从理想的内容划分，理想有( )。","o":["政治理想","道德理想","职业理想","生活理想","社会理想"],"a":"ABCD","e":"E项：“社会理想”是按理想的主体划分出的类型，不属于按内容划分（政治、道德、职业、生活理想）。"},{"ch":2,"t":"m","n":33,"stem":"在确立理想之时，要充分认识到理想的实现具有( )。","o":["长期性","艰巨性","曲折性","自发性","偶然性"],"a":"ABC","e":"D、E项：理想实现具有长期性、艰巨性、曲折性，不是自发、偶然实现的。"},{"ch":2,"t":"j","n":1,"stem":"从理想的性质上划分，理想可分为个人理想和社会理想。","a":"F"},{"ch":2,"t":"j","n":2,"stem":"信念是一种单纯的知识和想法。","a":"F"},{"ch":2,"t":"j","n":3,"stem":"信念是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的心理态度和精神状态。","a":"T"},{"ch":2,"t":"j","n":4,"stem":"在一定的社会中，人们的信念具有多样性，也有共通之处。","a":"T"},{"ch":2,"t":"j","n":5,"stem":"实践产生理想，理想指引实践，理想与实践相互作用、不断循环上升的过程，推动人们立足现实、着眼未来，在奋斗中追求，在追求中奋斗。","a":"T"},{"ch":2,"t":"j","n":6,"stem":"理想之所以能够成为一种推动人们创造美好生活的巨大力量，就在于它不仅具有现实性而且具有预见性。","a":"T"},{"ch":2,"t":"j","n":7,"stem":"凡是符合客观事物发展规律、反映人民群众根本利益的理想，是科学的理想；反之，是非科学的理想。","a":"T"},{"ch":2,"t":"j","n":8,"stem":"中国特色社会主义这一共同理想指引我们在改革开放以来取得了非常了不起的成绩和进步。","a":"T"},{"ch":2,"t":"j","n":9,"stem":"坚定的理想信念，必须建立在对马克思主义的深刻理解上，建立在对历史规律的深刻把握上。","a":"T"},{"ch":2,"t":"j","n":10,"stem":"信念是理想所指的对象，理想是信念实现的保障。","a":"F"},{"ch":2,"t":"j","n":11,"stem":"社会理想的实现，必须以个人理想的实现为前提和基础。","a":"F"},{"ch":2,"t":"j","n":12,"stem":"中国特色社会主义是当代中国发展进步的根本方向，是发展中国、稳定中国的必由之路。","a":"T"},{"ch":2,"t":"j","n":13,"stem":"信念有着绝对的稳定性。","a":"F"},{"ch":2,"t":"j","n":14,"stem":"一个人的理想信念越崇高、越坚定，精神境界和人格就会越高尚。","a":"T"},{"ch":2,"t":"j","n":15,"stem":"科学的理想是人的主观能动性与社会发展客观趋势的一致性的反映。","a":"T"},{"ch":2,"t":"j","n":16,"stem":"信念是认知、情感和意志的有机统一体，是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的心理态度和精神状态。","a":"T"},{"ch":2,"t":"j","n":17,"stem":"个人理想与社会理想的关系实质上是个人与社会的关系在理想层面上的反映。","a":"T"},{"ch":2,"t":"j","n":18,"stem":"强调个人理想要符合社会理想，并不是要排斥和抹杀个人理想，而是要摆正个人理想同社会理想的关系。","a":"T"},{"ch":2,"t":"j","n":19,"stem":"理想在现实中产生，与未来奋斗目标没有联系。","a":"F"},{"ch":2,"t":"j","n":20,"stem":"马克思主义具有与时俱进的理论品格和持久的生命力。","a":"T"},{"ch":2,"t":"j","n":21,"stem":"当代大学生肩负的历史使命是坚持和发展中国特色社会主义、实现中华民族伟大复兴的中国梦。","a":"T"},{"ch":2,"t":"j","n":22,"stem":"理想信念是一个思想认识问题，而不是一个实践问题。","a":"F"},{"ch":2,"t":"j","n":23,"stem":"理想仅有现实性而没有任何预见性。","a":"F"},{"ch":2,"t":"e","n":1,"stem":"（一）、在中国共产党历史展览馆广场上，矗立着一座名为《信仰》的雕塑，展现的是71位不同时代、不同身份、不同年龄的中国共产党员庄严宣誓的场景，充盈着信仰的力量。一代代中国共产党人正是凝聚在信仰的旗帜下，为理想信念前赴后继、接续奋斗。\n习近平总书记在广东考察时强调：“坚定理想信念，增强对党的价值追求和前进方向的高度政治认同，把好世界观、人生观、价值观这个“总开关’。”开展学习贯彻习近平新时代中国特色社会主义思想主题教育是党的建设的重大任务，其中一个具体目标是“凝心铸魂筑牢根本”，教育引导广大党员、干部经受思想淬炼、精神洗礼，坚定对马克思主义的信仰、对中国特色社会主义的信念、对实现中华民族伟大复兴中国梦的信心。我们要深刻领会习近平新时代中国特色社会主义思想关于坚定理想信念、提升思想境界、加强党性锻炼等一系列要求，筑牢信仰之基、补足精神之钙、把稳思想之舵，从思想上正本清源、固本培元，坚定不移地为实现既定目标而奋斗。\n结合材料，请理论联系实际分析：为什么说理想信念是精神之“钙”？","k":["理想信念是精神之“钙”：是人们行动的内在动力，有坚定信念才能在困难面前保持勇气和毅力。","引领思想和行为：缺“钙”会导致思想偏差、行为失范，理想信念能指引方向、避免迷失。","凝聚人心：共产党人因共同理想信念而团结奋斗，社会中同样需要共同理想凝聚力量、促进和谐。","提高精神境界：“心灵之钙”滋养心灵，使人真正领悟人生意义与价值。","结论：大学生要坚定理想信念，把个人追求融入民族复兴，在实践中不断“补钙”。"]},{"ch":2,"t":"e","n":2,"stem":"（二）材料一：扎根边疆的青春成长\n23 岁的阮彬彬从广西老家到吉林大学求学，再参军入伍到西北边陲，青春足迹在地图上画出一个三角形。初入军营时，第一次实弹射击考核因紧张导致不及格，战术基础动作考核也因手肘擦伤仅差一点及格。但他没有放弃，申请补考并拼尽全力达到及格线。老兵用营区白杨树“根扎得深才能长成参天大树”的比喻激励他，阮彬彬给这棵树起名“扎根树”，每天坚持训练。两个多月后，他在新训考核中综合成绩评定为优秀，成为全班第一名，最终前往喀喇昆仑守护祖国边防。他说：“希望我能像这棵树一样，把根深深扎在大地上，长得更高、更壮。”\n材料二：乡村教育的坚守与创新\n华东师范大学硕士毕业生李微楠2017年成为西部计划志愿者，前往云南省临沧市云县大寨中学支教。支教第一年，他因管理不善被校领导批评，甚至怀疑自己的选择。但他没有退缩，为把地理课变有趣，找来影视资料和各地特产辅助教学；在语文课开展阅读比赛和绘画活动；利用新闻专业知识指导学校广播站，开设 \"校坛风云\" 节目。支教 3 年，他对 20 多个村寨的102名学生进行家访，最远步行 30 多公里山路，为停电村寨学生送去 30 多台充电台灯。他所带班级的地理成绩从一半人不及格提升至全县前三名。两年支教结束后，他又申请延长服务期，后考上特岗教师并转为在编教师，2024 年获教育部 \"高校毕业生基层就业卓越奖学金\"。\n材料三：航天强国的青春接力\n2025 年 4 月 24 日，神舟二十号载人飞船成功发射，开启 \"神舟家族太空接力\" 新征程。航天员王杰曾在中国空间技术研究院工作，负责空间站微振动抑制关键技术攻关，后通过选拔成为航天飞行工程师，实现从 \"建造空间站\" 到 \"住进空间站\" 的梦想接力。为适应空间站应用与发展新阶段，神舟团队建立 \"多线并举，滚动待命\" 的批产技术状态管理模式，通过多项优化手段大幅压缩研制和测试时间，同时实施基于信息化的质量确认工作，确保 \"一次做对\"。团队始终弘扬 \"两弹一星\" 精神和载人航天精神，将 \"质量第一\" 理念挺在前头，在轨道舱原运能基础上拓展出约 20% 的上行载荷装载空间，为空间站运送更多关键物资。\n问题设计：\n1.结合材料，分析三位主人公的理想信念体现了《思想道德与法治》教材中理想信念的哪些基本内涵？他们的理想信念具有哪些共同特质？\n2.材料中的主人公在践行理想信念过程中都面临了不同挑战，请对比分析他们是如何将理想转化为现实行动的？这体现了理想与现实之间怎样的辩证关系？\n3.习近平总书记指出：\"理想信念不是拿来说、拿来唱的，更不是用来装点门面的，只有见诸行动才有说服力。\" 结合上述案例，谈谈当代大学生应如何在实现中华民族伟大复兴中国梦的实践中放飞青春梦想？","k":["基本内涵：理想信念是实践中形成的对未来的向往与追求，是世界观、人生观、价值观在奋斗目标上的集中体现。","共同特质：家国情怀（个人理想融入国家需要）、实践品格（用具体行动落实理想）、奋斗精神（困难面前不退缩）。","理想与现实的辩证关系：理想源于现实又高于现实；理想可转化为现实，需把目标分解为具体行动、发扬斗争精神。","案例对照：阮彬彬以“扎根树”自励、反复训练；李微楠创新教学、深入家访；神舟团队建立新管理模式、优化技术参数。","大学生启示：坚定理想信念、练就过硬本领、勇于实践奋斗、坚持知行统一、保持长期坚守。"]},{"ch":3,"t":"s","n":1,"stem":"爱国主义是调节个人和国家之间关系的道德要求、政治原则和（ ）。","o":["内心信念","法律规范","自觉行为","传统美德"],"a":"B"},{"ch":3,"t":"s","n":2,"stem":"中华传统文化源远流长，包含着丰富的内容，其中，夸父追日、大禹治水、愚公移山、精卫填海等动人的传说故事，体现着中国精神的（ ）。","o":["伟大梦想精神","伟大创造精神","伟大奋斗精神","伟大团结精神"],"a":"A"},{"ch":3,"t":"s","n":3,"stem":"以下关于实现中国梦必须弘扬中国精神的说法，不正确的是（ ）。","o":["激发创新创造的精神动力","增强个人自信","推进复兴伟业的精神支柱","凝聚中国力量的精神纽带"],"a":"B"},{"ch":3,"t":"s","n":4,"stem":"爱国主义最终的落脚点和归宿是（ ）。","o":["爱国理想","爱国思想","爱国行为","爱国情感"],"a":"C"},{"ch":3,"t":"s","n":5,"stem":"在经济全球化的时代背景下弘扬爱国主义，应该注意的一个误区是狭隘民族主义。因为狭隘民族主义（ ）。","o":["完全否定本国的传统和现实；","往往对本民族进行过度的颂扬和崇拜；","倡导从经济基础到上层建筑的一切领域都与西方接轨；","主张学习和吸收世界各国人民创造的一切优秀文明成果"],"a":"B"},{"ch":3,"t":"s","n":6,"stem":"邓小平曾告诫说：“谈到人格，但不要忘记还有一个国格。特别是像我们这样第三世界的发展中国家，没有民族自尊心，不珍惜自己民族的独立，国家是立不起来的。”在这里，国格的含义主要是指（ ）。","o":["政府的权威","国家的外交形象","民族自尊心和自豪感","民族历史传统"],"a":"C"},{"ch":3,"t":"s","n":7,"stem":"中国特色社会主义进入新时代，爱国主义的鲜明主题是（ ）。","o":["实现中华民族伟大复兴的中国梦","传承传统文化","赞美历史成就","热爱祖国河山"],"a":"A"},{"ch":3,"t":"s","n":8,"stem":"爱国主义中检验一个人对祖国忠诚程度的试金石是（ ）。","o":["热爱自己的骨肉同胞","热爱故土河山","热爱自己的国家","对祖国的忠诚和热爱"],"a":"A"},{"ch":3,"t":"s","n":9,"stem":"一个民族赖以生存和发展的精神动力和民族文化中最本质、最深刻的内容是（ ）。","o":["民族风俗","民族生活方式","民族精神","民族艺术"],"a":"C"},{"ch":3,"t":"s","n":10,"stem":"我国古代在天文历法、数学、农学、医学、地理学等众多领域取得了举世瞩目的成就，这些发明创造同当时的生产实践紧密结合，为中华民族的发展进步提供 "n":35,"stem":"中国近代民主革命的先驱者孙中山说：“天下大势，浩浩汤汤，顺之者昌，逆之者亡。”如果从精神层面讲，这段话说的是（ ）。","o":["时代精神","中国精神","民族精神","与时俱进精神"],"a":"A"},{"ch":3,"t":"s","n":36,"stem":"在几千年历史长河中，中国人民始终心怀梦想、不懈追求，我们不仅形成了小康生活的理念，而且秉持天下为公的情怀，盘古开天、女娲补天、伏羲画卦、神农尝草、夸父追日、精卫填海、愚公移山等我国古代神话深刻反映了中国人民勇于追求和实现梦想的执着精神。这些事例说明中华民族是一个具有（ ）的民族。","o":["伟大奋斗精神","伟大创造精神","伟大梦想精神","伟大团结精神"],"a":"C"},{"ch":3,"t":"s","n":37,"stem":"在几千年历史长河中，中国人民始终团结一心、同舟共济，建立了统一的多民族国家，发展了56个民族多元一体的融洽民族关系，形成了守望相助的中华民族大家庭。特别是近代以后，面对外来侵略寇急祸重的严峻形势，我国各族人民手挽手、肩并肩，英勇奋斗，浴血奋战，打败了一切穷凶极恶的侵略者，捍卫了民族独立和自由,共同书写了中华民族保卫祖国、抵御外辱的壮丽史诗。这些事例都说明中国人民是一个具有（ ）的民族。","o":["伟大梦想精神","伟大创造精神","伟大奋斗精神","伟大团结精神"],"a":"D"},{"ch":3,"t":"s","n":38,"stem":"在几千年历史长河中，中国人民始终革故鼎新、自强不息，开发和建设了祖国辽阔秀丽的大好河山，开拓了波涛万顷的辽阔海疆，开垦了物产丰富的广袤粮田，治理了桀骜不驯的千百条大江大河，战胜了数不清的自然灾害，建设了星罗棋布的城镇乡村，发展了门类齐全的产业，形成了多姿多彩的生活。这一系列的事例都说明中国人民是一个具有（ ）的民族。","o":["伟大奋斗精神","伟大创造精神","伟大团结精神","伟大梦想精神"],"a":"A"},{"ch":3,"t":"s","n":39,"stem":"在几千年的历史长河中，中国人民始终辛勤劳作、发明创造，我国产生了老子、孔子、庄子、孟子、墨子、孙子、韩非子等闻名于世的伟大思想巨匠，发明了造纸术、火药、印刷术、指南针等深刻影响人类文明进程的伟大科技成果，创作了诗经、楚辞、汉赋、唐诗、宋词、元曲、明清小说等伟大文艺作品，传承了格萨尔王、玛纳斯、江格尔等震撼人心的伟大史诗，建设了万里长城、都江堰、大运河、故宫、布达拉宫等气势浑宏的伟大工程。这一系列的事例都说明中国人民是一个具有（ ）的民族。","o":["伟大奋斗精神","伟大创造精神","伟大团结精神","伟大梦想精神"],"a":"B"},{"ch":3,"t":"s","n":40,"stem":"古籍《孔子家语·五仪解》中说：“人有五仪：有庸人，有士人，有君子，有贤人，有圣人。”强调圣人是人生追求的最高境界，并对圣人作了具体的描述，“所谓圣者,德合于天地，变通无方，穷万事之终始，协庶品之自然，敷其大道而遂成情性。明并日月，化行若神。下民不知其德，睹者不识其邻。此谓圣人也。”这段话反映出（ ）。","o":["中华民族是非常重视高尚品格养成的民族。","中华民族在理解物质生活和精神生活的相互关系时，认为精神生活比物质生活更重要，它是人之所以异于禽兽的主要标志，是中华民族崇尚精神优秀传统的重要标识。","中华民族认为，理想是激励个体的精神内驱力，是凝聚社会整体的精神力量，所以要矢志不渝的坚守理想，它反映着中华民族对理想的不懈追求，是中华民族崇尚精神典型体现。","中华民族十分强调道德修养和道德教化，对道德修养和道德教化的重视是中华民族崇尚精神优秀传统的重要内容。"],"a":"A"},{"ch":3,"t":"s","n":41,"stem":"古籍《世说新语·笺疏》里讲“德成智出，业广惟勤，小胜靠智，大胜靠德。”《中庸》中说“君子戒慎乎其所不睹，恐惧乎其所不闻。莫见乎隐，莫显乎微，故君子慎其独也。”这反映出（ ）。","o":["中华民族崇尚精神的优秀传统还表现在对理想人格的执着追求。","中华民族十分重视精神生活，对物质生活和精神生活的关系有自己独到的见解。","中华民族认为，理想是激励个体的精神内驱力，是凝聚社会整体的精神力量，所以要矢志不渝的坚守理想，它反映出中华民族对理想的不懈追求，是中华民族崇尚精神的典型体现。","中华民族十分强调道德修养和道德教化，重视道德修养和道德教化是中华民族崇尚精神优秀传统的重要内容。"],"a":"D"},{"ch":3,"t":"s","n":42,"stem":"关学大师张载在《张子语录·语录》中说：“为天地立心,为生民立命，为往圣继绝学，为万世开太平。”孔子强调的“杀身成仁”，孟子追求的“舍生取义”；范仲淹心系的“先天下之忧而忧，后天下之乐而乐”都说明（ ）。","o":["中华民族认为，理想是激励个体的精神内驱力，是凝聚社会整体的精神力量，所以要矢志不渝的坚守理想，它反映着中华民族对理想的不懈追求，是中华民族崇尚精神的典型体现。","中华民族在物质生活和精神生活的相互关系的理解上，认为精神生活比物质生活更重要，它是人之所以异于禽兽的主要标志，是中华民族崇尚精神优秀传统的重要标识。","中华民族十分强调道德修养和道德教化，重视道德修养和道德教化是中华民族崇尚精神优秀传统的重要内容。","中华民族崇尚精神的优秀传统还表现为对理想人格的执着追求。"],"a":"A"},{"ch":3,"t":"s","n":43,"stem":"古籍《论语·述而》中说，颜回“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”《论语·雍也》中也说，颜回“一箪食,一瓢饮,在陋巷。人不堪其忧,回也不改其乐。”这两段话反映了（ ）。","o":["中华民族认为，理想是激励个体的精神内驱力，是凝聚社会整体的精神力量，所以要矢志不渝的坚守理想。它反映出中华民族对理想的不懈追求，是中华民族崇尚精神的典型体现。","中华民族在物质生活和精神生活的相互关系的理解上，认为精神生活比物质生活更重要，它是人之所以异于禽兽的主要标志，是中华民族崇尚精神优秀传统的重要标识。","中华民族十分强调道德修养和道德教化，重视道德修养和道德教化是中华民族崇尚精神优秀传统的重要内容。","中华民族崇尚精神的优秀传统还表现在对理想人格的执着追求。"],"a":"B"},{"ch":3,"t":"s","n":44,"stem":"中华民族能在5000多年的历史长河中历经磨难仍坚韧不倒、生生不息、薪火相传的守候着完整的国家形态，传承着完整的中华文化，如果从精神层面看，其中一个很重要的原因就是深深根植于中华传统优秀文化中的（ ）。","o":["创造精神","爱国主义","团结精神","中国精神"],"a":"D"},{"ch":3,"t":"s","n":45,"stem":"习近平在《习近平谈治国理政》第2卷中讲：“人无精神则不立，国无精神则不强。精神是一个民族赖以长久生存的灵魂，唯有精神上达到一定的高度，这个民族才能在历史的洪流中屹立不倒、奋勇向前。”这段话集中论述了（ ）。","o":["在实现中华民族伟大复兴中国梦的过程中，必须弘扬中国精神，弘扬中国精神是实现中国梦的必要条件。","在实现中华民族伟大复兴中国梦的过程中，中国精神能弘扬最好，不弘扬也行。","在实现中华民族伟大复兴中国梦的过程中，必须弘扬中华民族精神，它是实现中国梦的必要条件。","在实现中华民族伟大复兴中国梦的过程中，必须弘扬改革创新的时代精神，要励精图治。"],"a":"A"},{"ch":3,"t":"m","n":1,"stem":"下列关于爱国主义概念的正确论述是（ ）。","o":["爱国主义体现了人们对自己祖国的深厚感情，揭示个人对祖国的依存关系","爱国主义是人们对自己家园以及民族和文化的归属感、认同感、尊严感与荣誉感的统一","爱国主义是调节个人与国家之间关系的道德要求、政治原则和法律规范","爱国主义是中华民族精神的民族心、民族魂，是中华民族最重要的精神财富","爱国主义就是爱国情感"],"a":"ABCD","e":"E项：爱国主义不只是情感，而是爱国情感、爱国思想、爱国行为的统一，该表述片面。"},{"ch":3,"t":"m","n":2,"stem":"新时代大力弘扬爱国主义的基本要求是（ ）。","o":["拥护国家的基本制度","遵守国家的宪法法律","维护国家安全和统一","捍卫国家利益","为国家的繁荣发展贡献自己的力量"],"a":"ABCDE","e":"五项均正确，本题为全选题。"},{"ch":3,"t":"m","n":3,"stem":"实现中国梦之所以要积极弘扬中国精神，主要是因为（ ）。","o":["它是凝聚中国力量的精神纽带","它是激发创新创造的精神动力","它是推进复兴伟业的精神支柱","它是爱国主义价值要求的体现","它是民族精神的客观要求"],"a":"ABC","e":"D、E项：中国精神的作用集中在凝聚力量、激发创新创造、提供精神支柱三点，其余表述不属于“为什么弘扬”。"},{"ch":3,"t":"m","n":4,"stem":"中国人民用勤劳和智慧书写了辉煌的中华历史，也培育铸就了独特的中国精神，为当代中国的发展和文明进步提供了强大的精神动力。中国精神的主要内容是（ ）。","o":["伟大创造精神","伟大奋斗精神","伟大团结精神","伟大梦想精神","愚公精神"],"a":"ABCD","e":"E项：“愚公精神”是具体精神形态，不是中国精神的主要内容（伟大创造、奋斗、团结、梦想精神）。"},{"ch":3,"t":"m","n":5,"stem":"改革创新是时代精神的核心，其内容包括（ ）。","o":["理论创新","制度创新","科技创新","文化创新"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":3,"t":"m","n":6,"stem":"改革创新要求人们自觉增强改革创新的能力本领。它要求大学生（ ）。","o":["夯实创新基础","培养创新思维","投身创新实践","增强创新意志","要有改革意识"],"a":"ABC","e":"D、E项：增强改革创新本领要求夯实创新基础、培养创新思维、投身创新实践，“增强创新意志”“改革意识”不在此列。"},{"ch":3,"t":"m","n":7,"stem":"下列关于爱国主义特点的表述，正确的有（ ）。","o":["爱国主义是现实的","爱国主义是历史的、具体的","爱国主义具有虚化的","在未来的共产主义社会，国家消亡后，爱国主义就会失去存在的条件和意义"],"a":"ABD","e":"C项：爱国主义是真实具体的，“虚化”表述错误。"},{"ch":3,"t":"m","n":8,"stem":"世界上没有哪个国家不主张爱国，爱国主义作为一种伟大的精神品格受到了各个国家人民的推崇。爱国主义是（ ）。","o":["一种重大的政治原则","人们对自己祖国的浓厚感情;","鼓舞和凝聚各民族的精神支柱","调整个人与国家关系的道德规范"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":3,"t":"m","n":9,"stem":"对个人而言，爱国主义包含着三个基本方面内容，它们是（ ），是三者的辩证统一。","o":["情感","思想","行为","认识"],"a":"ABC","e":"D项：爱国主义三方面内容是爱国情感、爱国思想、爱国行为，“认识”并入思想之中。"},{"ch":3,"t":"m","n":10,"stem":"关于爱国主义下列说法不正确的是（ ）。","o":["爱国主义不但要爱祖国的大好河山，还要爱祖国的灿烂文化","爱国主义在不同的历史时期有着不同的内涵","民族主义是爱国主义的高级阶段","民族主义等于爱国主义"],"a":"CD","e":"C项：民族主义不等同于爱国主义，更不是其“高级阶段”；D项：把二者划等号错误。"},{"ch":3,"t":"m","n":11,"stem":"在当代中国，爱国主义首先表现在对社会主义中国的热爱上，这是因为（ ）。","o":["选择社会主义制度，是中国人民长期艰苦奋斗的结果","中国共产党人的最高理想就是建设和发展中国特色社会主义","社会主义是一种先进的社会制度，用社会主义取代资本主义是人类历史发展的必然","改革开放以来我们取得一切成绩和进步的根本原因就是开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立中国特色社会主义制度，发展了中国特色社会主义文化。"],"a":"ACD","e":"B项：中国共产党人的最高理想是实现共产主义，不是建设中国特色社会主义。"},{"ch":3,"t":"m","n":12,"stem":"世界上没有一个民族能够在亦步亦趋走别人的路实现自己的发展振兴，也没有一个民族会在心神不宁、游移彷徨中成就自己的光荣与梦想。坚持和发展中国特色社会主义，需要我们（ ）只有自觉弘扬中国精神，增强民族自尊心和自信心，坚定不移走自己的路，才能使全体人民在实现复兴伟业的征途中拥有坚如磐石的精神和信仰力量，不畏困难吓倒，不为诱惑所动，不为干扰迷惑，坚定不移的把我们的事业不断推向前进，直至光辉彼岸。","o":["正确认识当代世界和中国发展大势;","正确认识中国精神;","正确认识中国特色和国际相比较，坚持道路自信、理论自信、制度自信和文化自信","正确弘扬中国精神","正确认识传统文化，增强全民族的文化自信"],"a":"AC","e":"B、D、E项：题干强调“正确认识世界和中国发展大势”“正确认识中国特色和国际比较”，其余属弘扬中国精神的其他要求，与设问不对应。"},{"ch":3,"t":"m","n":13,"stem":"习总书记说，实现中国梦必须弘扬中国精神，这是因为中国精神（ ）。","o":["是凝聚中国力量的精神纽带","是激发创造创新的精神动力","是兴国之魂强国之魂","是推进复兴伟业的精神定力","不能鼓舞民族复兴的斗志"],"a":"ABCD","e":"E项：中国精神能鼓舞民族复兴斗志，“不能鼓舞”表述错误。"},{"ch":3,"t":"m","n":14,"stem":"时代精神是一个国家和民族在新的历史条件下形成和发展的，是体现民族特质并顺应时代潮流的（ ）的总和，是一种对社会发展具有积极影响和推动作用的集体意识。","o":["思想观念","价值取向","精神风貌","社会风尚","时代要求"],"a":"ABCD","e":"E项：“时代要求”不是时代精神的构成要素（思想观念、价值取向、精神风貌、社会风尚）。"},{"ch":3,"t":"m","n":15,"stem":"习近平强调，民族复兴不仅表现为经济腾飞，更要有中国精神的振奋和彰显；只有（ ），中国特色社会主义事业才能顺利向前推进。","o":["物质文明建设和精神文明建设都搞好;","国家的物质力量和精神力量都增强","全国各族人民的物质生活和精神生活都改善;","政治民主和法治公平都彰显","以德治国和依法治国都实现"],"a":"ABC","e":"D、E项：习近平强调的是物质文明与精神文明、物质力量与精神力量、物质生活与精神生活“都搞好、都增强、都改善”，另两项不是原表述。"},{"ch":3,"t":"m","n":16,"stem":"在新民主主义革命时期，毛泽东在《纪念白求恩》这篇文章中说：“我们大家要学习他毫无自私自利之心的精神。从这点出发，就可以变为大有利于人民的人。一个人能力有大小，但只要有这点精神，就是一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人。”这段话反映了中国共产党是中华民族重精神优秀传统的（ ）。","o":["忠实继承者","坚定弘扬者","不变的固守者;","逆反的背叛者","机械的传承者"],"a":"AB","e":"C、D、E项：对传统精神应做忠实继承者、坚定弘扬者，“固守”“背叛”“机械传承”均不符合要求。"},{"ch":3,"t":"m","n":17,"stem":"中国精神是一个极为重要的概念，正确理解中国精神的概念内涵是弘扬中国精神的必要前提。中国精神的概念内涵包括（ ）。","o":["中国精神是以爱国主义为核心的民族精神和以改革创新为核心的时代精神的有机统一","中国精神是我国文明进步和发展的强大精神支柱和支撑","中国精神是凝心聚力的兴国之魂","中国精神是凝心聚力的强国之魂","中国精神是增强我国文化软实力的重要表现"],"a":"ABCD","e":"E项：增强文化软实力是中国精神的意义，不属于其概念内涵的四层表述。"},{"ch":3,"t":"m","n":18,"stem":"2013年3月5日，习近平在第十二届全国人民代表大会第一次会议上强调：实现中国梦必须弘扬中国精神。这就是以爱国主义为核心的民族精神，以改革创新为核心的时代精神。习近平认为，中国精神是（ ）。","o":["凝心聚力的兴国之魂","核心价值的精神之魂","凝心聚力的强国之魂","公平正义的法治之魂","崇尚善念的道德之魂"],"a":"AC","e":"B、D、E项：“核心价值的精神之魂”“法治之魂”“道德之魂”均为生造提法，习近平原话是兴国之魂、强国之魂。"},{"ch":3,"t":"m","n":19,"stem":"南开大学的创办者、老校长张伯苓针对学生“爱国三问”——你是中国人吗？你爱中国吗？你愿意中国好吗？这既是历史之问，也是时代之问、未来之问。这说明（ ）。（用92页材料）","o":["某大学硕士研究生田某某由于“辱国”言论被开除，说明新时代对大学生进行弘扬中国精神教育仍然具有一定的必要性。","现实生活中，在中国社会屡次出现“精日现象”，说明“爱国三问”仍然具有一定的现实性。","在经济全球化时代，“爱国三问”已经过时，不具有必要性","从构建人类命运共同体的角度看，“爱国三问”应该被弱化","从构建人类命运共同体的角度看，应该强调国际视野而不应该过分强调国家主权"],"a":"AB","e":"C项：“爱国三问已过时”错误；D项：人类命运共同体不意味着弱化爱国；E项：强调国际视野不能否定国家主权。"},{"ch":3,"t":"m","n":20,"stem":"实现中华民族伟大复兴的中国梦，必须弘扬中国精神，这就是（ ）。","o":["以爱国主义为核心的民族精神;","以改革创新为核心的时代精神","以坚韧不拔为核心的愚公精神","以为国分忧、为民族争气为核心的铁人精神","以勇于创造为核心的民族精神"],"a":"ABE","e":"C、D项：愚公精神、铁人精神是具体精神形态；E项：民族精神的核心是爱国主义，不是“勇于创造”。"},{"ch":3,"t":"m","n":21,"stem":"改革创新之所以是时代的要求，主要是因为（ ）。","o":["创新始终是推动人类社会发展的第一动力","创新能力是当今国际竞争新优势的集中体现","改革创新是我国赢得未来的必然要求","改革创新是我们的奋斗目标","改革创新是实现民族复兴的客观要求"],"a":"ABC","e":"D项：改革创新是动力和路径，不是奋斗目标本身；E项：不是教材所列的三条主要原因。"},{"ch":3,"t":"m","n":22,"stem":"爱国主义体现了人们对自己祖国的深厚感情、揭示了个人和国家的相互依存关系，是人们对自己家园以及民族和文化的（ ）的统一。","o":["归属感","认同感","尊严感","荣誉感","民族感"],"a":"ABCD","e":"E项：“民族感”不是教材表述，应为归属感、认同感、尊严感、荣誉感。"},{"ch":3,"t":"m","n":23,"stem":"维护国家统一是我国公民的基本义务，切实做好香港、澳门的繁荣稳定。在大陆地区，坚决反对（ ），做好民族团结工作，还要解决台湾问题。","o":["藏独","疆独","台独","港独"],"a":"AB","e":"C、D项：题干限定“在大陆地区”，针对的是藏独、疆独分裂势力；台独、港独属另外语境下的表述。"},{"ch":3,"t":"m","n":24,"stem":"新时代弘扬爱国主义，要求我们正确处理（ ），推动人类的文明的发展进步。","o":["立足中国与面向世界的辩证关系","既尊重各国的历史特点、文化传统、发展道路，并从中汲取有益成分壮大中华文化、增强其活力和生机","又要求同存异、交流互鉴、共同前进","中国精神和中国力量的关系"],"a":"ABC","e":"D项：“中国精神和中国力量的关系”不是新时代弘扬爱国主义要处理的那对关系。"},{"ch":3,"t":"m","n":25,"stem":"中国精神就是以（ ）为核心的民族精神和以（ ）为核心的时代精神的辩证统一，是我国文明进步和发展的强大精神支柱，是凝心聚力的兴国之魂、强国之魂。","o":["爱国主义","改革创新","延安精神","载人航天精神"],"a":"AB","e":"C、D项：延安精神、载人航天精神是具体精神形态，不是民族精神和时代精神的核心。"},{"ch":3,"t":"m","n":26,"stem":"（ ）是实现中华民族伟大复兴的必然要求，是不可阻挡的历史进程，也是全体中华儿女的共同心愿。","o":["保持香港长期繁荣稳定","保持澳门长期繁荣稳定","解决台湾问题、实现祖国完全统一","保持台湾长期繁荣稳定","经济增长率始终处于高位"],"a":"ABC","e":"D项：台湾问题的核心是实现祖国完全统一，不是“保持台湾长期繁荣稳定”；E项：经济增长率与题意无关。"},{"ch":3,"t":"m","n":27,"stem":"2005年3月14日第十届全国人民代表大会第三次会议通过 《反分裂国家法》。《反分裂国家法》规定：（ ）国家得采取非和平方式及其他必要措施，捍卫国家主权和领土完整。”","o":["“台独”分裂势力以任何名义、任何方式造成台湾从中国分裂出去的事实","或者发生将会导致台湾从中国分裂出去的重大事变","或者和平统一的可能性完全丧失","或者台湾地方政府否定“九二共识”","或者台湾地方政府实行“亲美仇中”的外交政策"],"a":"ABC","e":"D、E项：《反分裂国家法》规定的三种情形是造成分裂事实、发生重大事变、和平统一可能性完全丧失，不含否定“九二共识”、亲美仇中。"},{"ch":3,"t":"m","n":28,"stem":"我国的爱国主义始终围绕着实现（ ）而发展，最终汇流于中国特色社会主义。中国特色社会主义道路、理论体系、制度体系、文化体系是实现民族复兴中国梦的唯一正确的道路、理论、制度和文化，必须予以坚持。要坚持中国特色社会主义，就必须同各种违背中国特色社会主义的错误思潮作斗争，对其予以批判。","o":["国家富强","人民幸福","民族独立","民族解放","民族复兴"],"a":"ABCD","e":"E项：民族复兴是总目标，爱国主义围绕的是国家富强、民族独立、民族解放、人民幸福。"},{"ch":3,"t":"m","n":29,"stem":"爱国主义体现了人民群众对自己祖国的深厚感情，这种深厚感情主要是对祖国的（ ）。","o":["荣誉感","归属感","尊严感","认同感","庄严感"],"a":"ABCD","e":"E项：“庄严感”不是教材表述的四种情感。"},{"ch":3,"t":"m","n":30,"stem":"爱国主义是（ ）的有机统一体。","o":["爱国情感","爱国思想","爱国行为","爱国意志","爱国认识"],"a":"ABC","e":"D、E项：爱国主义是爱国情感、爱国思想、爱国行为的统一体，不含“爱国意志”“爱国认识”。"},{"ch":3,"t":"m","n":31,"stem":"爱国主义是调节国家和个人之间关系的理论原则和规范，这个理论原则和规范是通过（ ）等形式表现的。","o":["政治原则","道德要求","法律规范","价值追求","人的主观意识"],"a":"ABC","e":"D、E项：爱国主义通过政治原则、道德要求、法律规范三种形式表现，不含价值追求和主观意识。"},{"ch":3,"t":"m","n":32,"stem":"新时代的大学生，在实现中华民族伟大复兴的历史进程中应该做忠诚的爱国者。下列哪些选项是做忠诚的爱国者的要求（ ）。","o":["维护和促进祖国统一","促进民族团结","增强国家安全意识","履行维护国家安全义务","不遵守国家法律"],"a":"ABCD","e":"E项：“不遵守国家法律”与做忠诚爱国者的要求直接冲突。"},{"ch":3,"t":"m","n":33,"stem":"改革创新，首先要求人们自觉树立改革创新的自觉意识。它要求大学生（ ）。","o":["增强改革创新的责任感","树立敢于突破陈规的意识","树立大胆探索未知领域的信心","增强克服困难的意志","不唯书不唯上的思想品质"],"a":"ABC","e":"D、E项：自觉树立改革创新意识包括增强责任感、树立突破陈规意识、树立探索未知的信心，另两项属于能力本领层面。"},{"ch":3,"t":"m","n":34,"stem":"新时代的大学生置身于实现中华民族伟大复兴的时代洪流之中，应当以时代使命为己任，把握时代脉搏、迎接时代挑战，做改革创新的生力军。这需要（ ）。","o":["树立改革创新的自觉意识","增强改革创新的能力本领","强化为民服务的初心信仰","践行社会主义核心价值观","增强克服困难的精神毅力"],"a":"AB","e":"C、D、E项：做改革创新生力军要求树立自觉意识、增强能力本领，其余不属于教材所列的两项要求。"},{"ch":3,"t":"m","n":35,"stem":"2025年9月3日，北京天安门广场上，一支支新型作战编队隆隆驶过，无人机蜂群与隐形战机协同编组，高超音速导弹巍然矗立，部分陆海空基战略重器、高超精打、无人和反无人装备首次亮相，这不是科幻电影，而是中国抗战胜利80周年阅兵式的现实场景。以上内容说明：","o":["创新是推动发展人类社会的重要力量","创新能力是当今国际竞争新优势的集中体现","创新能够引领发展的主动权","创新是国家发展全局的核心位置","最根本的是要增强自主创新能力"],"a":"BC","e":"按参考答案，材料直接说明的是“创新能力是国际竞争新优势的集中体现”“创新能够引领发展的主动权”；A、D、E属引申性表述，非材料直接指向。"},{"ch":3,"t":"j","n":1,"stem":"伟大的民族精神包括伟大创造精神、伟大奋斗精神和伟大团结精神。","a":"F"},{"ch":3,"t":"j","n":2,"stem":"国防力量强大能为国家、民族的生存发展提供有力的支撑，而国防力量羸弱则会使国家、民族面临凌辱甚至被侵略的灾难。","a":"T"},{"ch":3,"t":"j","n":3,"stem":"如果国家无法给予我想得到的东西，我就有理由不爱国。","a":"F"},{"ch":3,"t":"j","n":4,"stem":"爱国不分先后，爱国也不在于做大事还是做小事。","a":"T"},{"ch":3,"t":"j","n":5,"stem":"在现阶段，爱国主义主要表现在献身于建设和保卫社会主义现代化事业，献身于促进祖国统一的事业。","a":"F"},{"ch":3,"t":"j","n":6,"stem":"爱国主义在不同的历史时代和文化背景下，其内涵不同。","a":"T"},{"ch":3,"t":"j","n":7,"stem":"爱祖国是抽象的政治概念，不是具体的。","a":"F"},{"ch":3,"t":"j","n":8,"stem":"中国精神就是以改革创新为核心的民族精神和以爱国主义为核心的时代精神。","a":"F"},{"ch":3,"t":"j","n":9,"stem":"习近平主持召开中央国家安全委员会第一次会议时强调，坚持总体国家安全观，即必须坚持以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，走出一条中国特色国家安全道路。","a":"T"},{"ch":3,"t":"j","n":10,"stem":"培养创新型思维方式是增强改革创新能力本领的前提。","a":"T"},{"ch":3,"t":"j","n":11,"stem":"“一国两制”是求维护祖国统一之同，存意识形态之异。","a":"T"},{"ch":3,"t":"j","n":12,"stem":"爱国主义是一个社会范畴，它是随着社会的发展而变化的，反映的是社会发展的客观规律。","a":"T"},{"ch":3,"t":"j","n":13,"stem":"实施创新驱动发展战略，最根本的是要增强自主创新能力，最紧迫的是要破除体制机制障碍，最大限度地解放和激发科技作为第一生产力所蕴含的巨大潜能。","a":"T"},{"ch":3,"t":"j","n":14,"stem":"爱国主义是调节个人与祖国之间关系的道德要求。","a":"T"},{"ch":3,"t":"j","n":15,"stem":"中国精神是我国当今时代的民族精神和时代精神的有机统一。","a":"F"},{"ch":3,"t":"j","n":16,"stem":"中国精神具有浓烈的中华民族特征，赋予中国精神这种特征的是改革创新。","a":"F"},{"ch":3,"t":"j","n":17,"stem":"在中华民族的悠久历史中，爱国主义始终是激昂的主旋律，是激励我国各族人民自强不息的强大力量。","a":"T"},{"ch":3,"t":"j","n":18,"stem":"“灭人之国，必先去其史”。这句话说明在新时代坚守爱国主义必须要尊重和传承中华民族的历史和文化。","a":"T"},{"ch":3,"t":"j","n":19,"stem":"改革开放始终是推动人类社会发展的第一动力。","a":"F"},{"ch":3,"t":"j","n":20,"stem":"民族精神和时代精神是相互独立、各自发展的，共同构成了中国精神。","a":"F"},{"ch":3,"t":"e","n":1,"stem":"新时代的中国青年肩负着民族复兴的重任。回顾历史，从‘两弹一星’元勋们隐姓埋名、无私奉献，到中国航天人‘特别能吃苦、特别能战斗、特别能攻关、特别能奉献’的载人航天精神；从抗疫斗争中逆行而上的白衣天使，到奋战在脱贫攻坚一线的党员干部……在他们身上，我们看到了爱国主义精神的伟大传承，也看到了改革创新、锐意进取的时代光芒。中国精神正是在一代代人的奋斗中得以继承和弘扬。”\n结合材料，请回答：\n1、“中国精神”的内涵是什么？材料中是如何体现这一内涵的？\n2、作为新时代的青年大学生，你应该如何理解和践行“中国精神”，为实现中华民族伟大复兴贡献自己的力量？","k":["中国精神的内涵：以爱国主义为核心的民族精神和以改革创新为核心的时代精神的统一。","爱国主义体现：两弹一星元勋的奉献、航天人的攻关奉献、抗疫逆行者的担当、扶贫干部的为民情怀，都把国家利益放在首位。","改革创新体现：打破技术垄断、攻关未知领域，抗疫与脱贫中的新方法新模式，都是改革创新、敢于超越的时代精神。","理解与坚定：认识中国精神是凝聚中国力量、实现民族复兴的精神纽带，坚定“四个自信”。","继承传统：学习英雄模范事迹，把爱国情、强国志落实到日常学习生活。","勇于创新：珍惜学习时光，培养批判性思维与创新能力，练就过硬本领。","投身实践：参与社会实践和志愿服务，把个人理想融入国家发展伟业。"]},{"ch":4,"t":"s","n":1,"stem":"（ ）是社会主义核心价值体系的基础。","o":["民族精神和时代精神","社会主义荣辱观","马克思主义指导思想","中国特色社会主义共同理想"],"a":"B"},{"ch":4,"t":"s","n":2,"stem":"社会主义核心价值体系是全党全国各族人民团结奋斗的（ ）。","o":["共同纲领","共同理想","共同思想基础","理论基础"],"a":"C"},{"ch":4,"t":"s","n":3,"stem":"社会主义核心价值体系把我们党倡导的基本理论、思想观念和（ ）系统凝练地整合在一起。","o":["价值取向","基本纲领","基本路线","方针政策"],"a":"A"},{"ch":4,"t":"s","n":4,"stem":"（ ）是践行社会主义核心价值体系的主体。","o":["工人阶级","青少年","党员干部","人民群众"],"a":"D"},{"ch":4,"t":"s","n":5,"stem":"建设社会主义核心价值体系，第一位的就是坚持（ ）。","o":["社会主义核心价值观","中国共产党的执政地位","中国特色社会主义","马克思主义的指导地位"],"a":"A"},{"ch":4,"t":"s","n": 神动力"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":4,"t":"m","n":7,"stem":"加强社会主义核心价值观体系建设的重要意义，在于社会主义核心价值体系（ ）。","o":["指明了中国发展的前进方向","凝聚了民族团结的力量","提供了国家发展的强大动力","奠定了社会和谐的思想基础"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":4,"t":"m","n":8,"stem":"社会主义核心价值观以其（ ）而居于人类社会的价值制高点，具有强大的道义力量。","o":["先进性","人民性","真实性","阶级性"],"a":"ABC","e":"D项：社会主义核心价值观的道义力量来自先进性、人民性、真实性，“阶级性”不是其居价值制高点的原因。"},{"ch":4,"t":"m","n":9,"stem":"社会主义核心价值体系的基本内容是（ ）。","o":["马克思主义指导思想","中国特色社会主义共同理想","以爱国主义为核心的民族精神和以改革创新为核心的时代精神","社会主义荣辱观"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":4,"t":"m","n":10,"stem":"社会主义核心价值观的基本范畴和基本原则有（ ）。","o":["倡导富强、民主、文明、和谐","倡导自由、平等、公正、法治","倡导爱国、敬业、诚信、友善","倡导改革、开放、民主、科学"],"a":"ABC","e":"D项：“改革、开放、民主、科学”不是社会主义核心价值观的24字表述。"},{"ch":4,"t":"m","n":11,"stem":"在全社会培育和弘扬社会主义核心价值观，需要大学生始终走在时代前列，成为社会主义核心价值观的（ ）。","o":["坚定信仰者","积极传播者","模范践行者","忠实守护者"],"a":"ABC","e":"D项：大学生应做社会主义核心价值观的坚定信仰者、积极传播者、模范践行者，“忠实守护者”不在此列。"},{"ch":4,"t":"m","n":12,"stem":"“一种价值观要真正发挥作用，必须融入社会生活，让人们在实践中感知它，领悟它。”大学生要切实做到（ ），使社会主义核心价值观成为一言一行的基本遵循。","o":["勤学","修德","明辨","笃实"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":4,"t":"m","n":13,"stem":"在社会主义核心价值观建设中，要深入挖掘和阐发中国传统文化讲仁爱、重民本以及（ ）的时代价值。","o":["守诚信","崇正义","尚和合","求大同"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":4,"t":"m","n":14,"stem":"推进社会主义核心价值观与社会主义核心价值体系建设，就是要弘扬共同理想、凝聚精神力量、引领道德风尚，形成（ ）的精神纽带，使我们的国家、民族、人民在思想上和精神上强起来，更好地坚持中国道路、弘扬中国精神、凝聚中国力量。","o":["团结向上","奋发向上","团结和睦","和睦融洽"],"a":"BC","e":"A、D项：教材表述为形成“奋发向上、团结和睦”的精神纽带，另两项用词不符。"},{"ch":4,"t":"m","n":15,"stem":"社会主义核心价值观体现了社会主义的本质要求，是对我们要（ ）等重大问题的深刻解答。","o":["建设什么样的国家","建设什么样的社会","培养什么样的公民","坚持什么样的道路"],"a":"ABC","e":"D项：社会主义核心价值观解答的是建设什么样的国家、社会、培养什么样的公民，“坚持什么样的道路”不在此列。"},{"ch":4,"t":"m","n":16,"stem":"关于社会主义核心价值观，下列表述正确的是( )。","o":["要同国家制度相配合","要与中华民族优秀灿烂的历史文化相契合","要同我们所要解决的时代问题相适应","要同我们正在进行的奋斗相结合"],"a":"BCD","e":"A项：原文是“同这个民族、这个国家的历史文化相契合，同人民正在进行的奋斗相结合，同需要解决的时代问题相适应”，不含“同国家制度相配合”。"},{"ch":4,"t":"m","n":17,"stem":"坚定的核心价值观自信，是中国特色社会主义( )的价值内核。","o":["道路自信","理论自信","制度自信","文化自信"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":4,"t":"m","n":18,"stem":"社会主 辱观","践行社会主义核心价值观，就是对社会主义核心价值体系的根本坚持"],"a":"ABDE","e":"C项：二者是内核与体系的关系，内容上不等同，只是表述不同也错误。"},{"ch":4,"t":"j","n":1,"stem":"社会主义核心价值观具有先进性、人民性和真实性。","a":"T"},{"ch":4,"t":"j","n":2,"stem":"对一个民族、一个国家来说，最持久、最深层的力量是全社会共同认可的核 心价值观。","a":"T"},{"ch":4,"t":"j","n":3,"stem":"社会主义核心价值观必须广泛借鉴世界文明成果，符合人类最美好的价值追求。","a":"T"},{"ch":4,"t":"j","n":4,"stem":"雷锋精神是社会主义核心价值观的生动体现。","a":"T"},{"ch":4,"t":"j","n":5,"stem":"中国优秀传统文化是社会主义核心价值观产生与存在的土壤和社会基础。","a":"T"},{"ch":4,"t":"j","n":6,"stem":"培育和践行社会主义核心价值观，能够有效解决和化解我国的社会矛盾。","a":"T"},{"ch":4,"t":"j","n":7,"stem":"爱国、敬业、诚信、友善，是公民基本道德规范，人人都要遵守。","a":"T"},{"ch":4,"t":"j","n":8,"stem":"建设中国特色社会主义，要突出重点项目来发展，提高国家文化软实力是当前的重中之重。","a":"T"},{"ch":4,"t":"j","n":9,"stem":"中国特色社会主义不是从天上掉下来的，也不是什么复制品、舶来品。","a":"T"},{"ch":4,"t":"j","n":10,"stem":"社会主义核心价值观是社会主义核心价值体系的内核，体现着社会主义核心价值体系的根本性质和基本特征。","a":"T"},{"ch":4,"t":"j","n":11,"stem":"社会主义核心价值观的道义力量主要来源于它的先进性。","a":"F"},{"ch":4,"t":"j","n":12,"stem":"一个民族、一个国家的核心价值观与这个民族、这个国家的历史文化没有关系。","a":"F"},{"ch":4,"t":"j","n":13,"stem":"“扣好人生的扣子”反映出青年时期的价值观养成十分重要。","a":"T"},{"ch":4,"t":"e","n":1,"stem":"为应对人口老龄化挑战，提升老年人生活质量，某市积极推广智慧养老服务模式。该模式通过建设智慧养老服务平台，整合医疗、康复、护理、家政等多元化服务资源，为老年人提供个性化、精准化的养老服务。平台利用物联网、大数据、云计算等现代信息技术，实现养老服务的智能化、高效化和便捷化。同时，政府还鼓励社会力量参与智慧养老服务平台的建设和运营，推动形成政府主导、社会参与的养老服务格局。\n请问上述材料体现了社会主义核心价值观的那些特性？请结合材料进行分析。","k":["先进性：运用物联网、大数据等技术实现养老服务智能化、高效化，体现对创新养老模式的推动。","人民性：以老年人实际需求为导向，提供个性化、精准化服务，引导社会力量参与，体现以人民为中心。","道义性：保障老年人权益、引导尊老敬老风尚，体现道义担当。"]},{"ch":4,"t":"e","n":2,"stem":"“智行”是一家国内迅速崛起的科技公司，其开发的人工智能算法广泛应用于社会招聘、信贷评估、公共服务等领域，公司以“效率至上、技术中立”为核心企业文化，取得了巨大的商业成功。然而，近期有媒体和公众曝出，其算法存在“大数据杀熟”（对老客户定价更高）、根据用户户籍和消费历史进行“隐形歧视”（如某些地区的用户更难获得贷款）以及为了追求流量而推送低俗内容等问题。面对质疑，公司发言人回应：“算法只是工具，本身没有价值观。问题的根源在于输入的数据本身存在社会偏见，而非技术。我们的首要职责是为股东创造最大价值。”\n此事引发了社会各界的广泛讨论。有人认为技术无罪，企业追求利润天经地义；也有人认为科技企业必须承担起应有的社会责任，不能成为社会偏见的放大镜。\n请结合本章所学内容，分析以下问题：\n1、请运用社会主义核心价值观的内容，分析“智行”公司的行为和回应存在哪些价值偏差？\n2、“算法只是工具，本身没有价值观”这一观点是否正确？为什么？","k":["国家层面：偏离“公正”与“法治”——“大数据杀熟”“隐形歧视”违背机会公平、规则公平，涉嫌违法。","国家层面：偏离“富强”——富强是全体人民共同富裕与国家繁荣，而非企业短期利润最大化。","社会层面：偏离“平等”“公正”——按户籍、消费历史区别对待，放大社会偏见、加剧不平等。","个人层面：偏离“敬业”“诚信”——“唯股东利益论”是狭隘敬业观；杀熟是对用户信任的背叛。","“算法只是工具”错误：算法由人设计，必然嵌入设计者、决策者的价值偏好，选择数据与目标本身就是价值判断。","算法能重塑价值观：广泛应用于社会决策后，会成为塑造规则、影响认知的力量，不再是中立工具。"]},{"ch":5,"t":"s","n":1,"stem":"社会主义职业道德中最高层次的要求是（ ）。","o":["诚实守信","爱岗敬业","办事公道","奉献社会"],"a":"D"},{"ch":5,"t":"s","n":2,"stem":"下列的内容中不属于网络生活中的道德要求的是（ ）。","o":["加强网络道德自律","正确使用网络工具","营造良好网络道德环境","实名制登记上网"],"a":"D"},{"ch":5,"t":"s","n":3,"stem":"社会公德的主要内容中，（ ）是每个公民应该承担的责任义务，既显示了个人道德修养水平，也是社会文明水平的重要标志。","o":["遵守秩序","爱护公物","文明礼貌","助人为乐"],"a":"B"},{"ch":5,"t":"s","n":4,"stem":"公民应该恪忠职守，兢兢业业地工作，克己奉公，服务社会。这是公民基本道德规范中（ ）的要求。","o":["敬业奉献","团结友善","明礼诚信","勤俭自强"],"a":"A"},{"ch":5,"t":"s","n":5,"stem":"由一定规则维系的人们公共生活的一种有序化状态是（ ）。","o":["公共生活","公共状态","公共秩序","公共领域"],"a":"C"},{"ch":5,"t":"s","n":6,"stem":"等公车时主动排队，上车自觉买票；过马路遵守交通规则，不闯红灯；购物、提款、游览观光时按照先后顺序，不插队。以上这些行为都属于对社会公德中（ ）。","o":["文明礼貌的要求","助人为乐的要求","保护环境的要求","爱护公物的要求"],"a":"A"},{"ch":5,"t":"s","n":7,"stem":"陶行知先生说：“爱之酒，甜而苦，两人喝是甘露，三人喝是酸醋，随便喝，要中毒。”这体现了爱情的（ ）。","o":["强烈持久性","生物本能性","平等互爱性","专一排他性"],"a":"D"},{"ch":5,"t":"s","n":8,"stem":"下列不属于社会公德缺失的是（ ）。","o":["过马路闯红灯","排队加塞","夫妻在家打架","不爱护公物"],"a":"C"},{"ch":5,"t":"s","n":9,"stem":"大学生中存在的“不在乎天长地久，只在乎曾经拥有”的爱情观是属于（ ）。","o":["错置爱情的地位","只重过程不顾结果","片面、功利化的对待爱情","误把友谊当爱情"],"a":"B"},{"ch":5,"t":"s","n":10,"stem":"网络生活中要求人们形成道德自律是因为网络生活的（ ）。","o":["信息广泛性","方便快捷","虚拟性","覆盖面广"],"a":"C"},{"ch":5,"t":"s","n":11,"stem":"在职业活动中提倡（ ），并不是一个高不可攀的道德标准，在社会主义社会里，每个公民无论从事什么工作、能力如何，都能够在本职岗位上，通过不同的形式为人民服务。每一个从业人员在职业活动中，都自觉遵循服务群众的要求，整个社会就会形成一种人人都是服务者，人人又都是服务对象的良好秩序与和谐状态。","o":["办事公道","爱岗敬业","服务群众","诚实守信"],"a":"C"},{"ch":5,"t":"s","n":12,"stem":"（ ）是社会主义职业道德中最高层次的要求，体现了社会主义职业道德的最高目标指向的精神。","o":["办事公道","诚实守信","奉献社会","爱岗敬业"],"a":"C"},{"ch":5,"t":"s","n":13,"stem":"2019年10月，中共中央、国务院印发的《新时代公民道德建设实施纲要》中规定了公民道德建设的总体要求，其中属于行业中扎根立足的基础是（ ）。","o":["诚实守信","爱国守法","勤奋自强","团结友善"],"a":"A"},{"ch":5,"t":"s","n":14,"stem":"道德作为特殊的社会意识形态对于社会发展具有多种功能。通过评价等方式，指导和纠正人们的行为和实践活动，协调人们之间的关系，是道德的( )。","o":["调节功能","认识功能","激励功能","沟通功能"],"a":"A"},{"ch":5,"t":"s","n 游搭子）的流行，说明现代社会中传统的家庭美德和亲密朋友关系已经不再重要。","a":"F"},{"ch":5,"t":"j","n":41,"stem":"面对他人陷入困境（如意外摔倒），在确保自身和环境安全的前提下伸出援手，是公民社会责任感的表现。","a":"T"},{"ch":5,"t":"j","n":42,"stem":"某青年在求职时精心“包装”简历，虚构工作经历和学历，这是为了争取机会的灵活变通，不属于诚信问题。","a":"F"},{"ch":5,"t":"j","n":43,"stem":"在学术研究中，引用他人观点而不注明出处，即使篇幅很短，也属于学术不端行为，违背了诚信原则。","a":"T"},{"ch":5,"t":"j","n":44,"stem":"弘扬传统美德就是要完全恢复古代的一切礼仪和规范，不能有任何改变。","a":"F"},{"ch":5,"t":"j","n":45,"stem":"个人品德是“小德”，只要遵守法律法规，“小德”有所欠缺也不会影响社会整体风气。","a":"F"},{"ch":5,"t":"e","n":1,"stem":"【案例材料】\n2023年夏季，受台风“杜苏芮”影响，中国京津冀地区遭遇了历史罕见的特大暴雨洪涝灾害。在本次抗洪救灾过程中，涌现出无数可歌可泣的感人事迹。\n事迹一：“逆行”的救援队伍。暴雨如注，洪水肆虐，多支民间救援队自发从全国各地驰援河北涿州、北京门头沟等重灾区。他们自带皮划艇、救援设备，不顾个人安危，在湍急的洪水中连续奋战数十小时，转移被困群众，运送紧急物资。一位来自外省的救援队员说：“没想那么多，看到消息就来了，这里的人需要帮助。”\n事迹二：“临时爸妈”的托举。在河北一处受灾群众安置点，一名几个月大的婴儿急需奶粉和尿不湿。消息发出后，附近未受灾地区的群众纷纷响应，冒着风雨将物资送达。安置点的志愿者们24小时轮班照料与家人失散的老人和儿童，被孩子们亲切地称为“临时爸妈”，给予了他们家人般的温暖。\n事迹三：“舍小家为大家”的基层干部。门头沟区某村镇党支部书记在洪水来临前，连续36小时不眠不休，组织村民向高地转移。自家的小卖部被洪水冲毁，货物全部损失，但他却说：“我是党员，是干部，乡亲们一个没少，这就是最大的胜利。”\n【根据案例，请回答以下问题】\n1、结合材料分析，上述抗洪救灾中的感人事迹分别体现了“为人民服务”道德核心的哪些具体内涵和要求？\n2、“为人民服务”并非遥不可及，它体现在日常生活的实践中。作为新时代大学生，你可以通过哪些具体行动来践行这一社会主义道德核心？","k":["事迹一体现利他性与奉献精神：各地救援队自发无偿奔赴灾区，把群众生命安全放在首位，是“为人民服务”最直接的体现。","事迹二体现广泛性与平凡性：群众捐赠物资、志愿者当“临时爸妈”，说明为人民服务面向并依靠广大群众。","事迹三体现先进性与榜样性：党员干部舍小家为大家，诠释了对先进分子“吃苦在前、享受在后”的更高要求。","大学生践行路径一：投身志愿服务（社区治理、环保、支教助学等），在奉献中实现价值。","路径二：刻苦学习本领，掌握专业知识与技能，为将来服务人民打基础。","其他可行：团结同学互助、遵守社会公德、维护公共利益、利用新媒体传播正能量。"]},{"ch":6,"t":"s","n":1,"stem":"法律作为上层建筑的重要组成部分，不是凭空出现的，而是产生于特定社会（ ）基础之上。","o":["物质生活条件","文化生活条件","政治权力","统治阶级意志"],"a":"A"},{"ch":6,"t":"s","n":2,"stem":"我国制定社会主义法律的出发点和归宿是（ ）。","o":["保障和实现人民的民主权利","建设社会主义和谐社会","建立和完善社会主义法律体系","建设社会主义法治国家"],"a":"A"},{"ch":6,"t":"s","n":3,"stem":"法律所体现的统治阶级意志，并不是统治阶级意志的全部，仅仅是上升为（ ）的那部分意志。","o":["全民意志","国家意志","党的意志","工人阶级意志"],"a":"B"},{"ch":6,"t":"s","n":4,"stem":"（ ）是中国特色社会主义法治体系的根本制度基础，是全面依法治国的根本制度保障。","o":["中国特色社会主义道路","中国特色社会主义理论体系","中国特色社会主义制度","中国特色社会主义文化"],"a":"C"},{"ch":6,"t":"s","n":5,"stem":"既是保证法律发挥作用的基本前提和要求，又是保障个人平安幸福的底线和红线的是（ ）。","o":["全体社会成员都尊重法律权威","法律本身的科学性、合理性"
