于揭露违法犯罪行为","勇于帮扶弱者，克服事不关己高高挂起的消极心态"],"a":"ABCDE","e":"五项均正确，本题为全选题。"},{"ch":6,"t":"m","n":14,"stem":"关于法治思维的说法，正确的有（ ）。","o":["中国历史上重视人治，这种思想的存留并不影响法治思维的培养","大学生还年轻，培养法治思维是将来的事","法律思维与政治思维、道德思维并行不悖","法律思维是现代社会成员应当具备的一种思维，与公民的专业和职业没有关系","法治思维以法律原则和法律规则为依据来指导人们的社会行为，是一种规范性思维"],"a":"CDE","e":"A项：人治思想存留会影响法治思维培养，“并不影响”错误；B项：法治思维应从当下培养，“将来的事”错误。"},{"ch":6,"t":"m","n":15,"stem":"我国依宪执政与西方宪政存在本质区别，主要表现为（ ）。","o":["制度基础不同","领导力量不同","权力主体不同","权力行使方式不同","宪政实施程度不同"],"a":"ABCD","e":"E项：我国不实行西方宪政，“宪政实施程度”这一比较维度不存在，不属于本质区别。"},{"ch":6,"t":"m","n":16,"stem":"法律至上具体表现为法律的（ ）。","o":["普遍适用性","优先适用性","不可违抗性","任意处罚性","随机调整性"],"a":"ABC","e":"D项：“任意处罚性”违背法治；E项：“随机调整性”与法律的稳定性、确定性相反。"},{"ch":6,"t":"m","n":17,"stem":"下列关于法治和德治的说法，正确的有（ ）。","o":["德治发挥作用要以国家强制力为后盾","法治主要通过道德教化发挥作用","与德治相比，法治更为重要","德治和法治二者不可或缺","法治和德治的实现方式和实施载体不同"],"a":"DE","e":"A项：以国家强制力为后盾的是法治；B项：靠道德教化发挥作用的是德治；C项：法治与德治并无轻重之分，二者不可或缺。"},{"ch":6,"t":"m","n":18,"stem":"我国追求以德治国，重在弘扬（ ）","o":["儒家传统道德风范","社会主义核心价值观","社会主义道德","普世价值观","老子的“无为而治”观"],"a":"BC","e":"A项：以德治国不是复古儒家道德；D项：“普世价值”是西方话语；E项：“无为而治”与以德治国无关。"},{"ch":6,"t":"m","n":19,"stem":"在依法治国中，坚持人民主体地位，就意味着（ ）。","o":["维护人民利益是执政的根本出发点和落脚点","要尊重和保障人权","必须保证人民的广泛参与","要实现人民幸福","特殊情况下可以借鉴模仿西方国家少数人主导的精英法治"],"a":"ABCD","e":"E项：我国坚持人民主体地位，不搞少数人主导的“精英法治”。"},{"ch":6,"t":"m","n":20,"stem":"下列哪些属于具有中国特色的社会主义制度（ ）。","o":["三权分立","民族区域自治制度","司法独立","人民代表大会制度","基层群众自治制度"],"a":"BDE","e":"A项：三权分立是西方政治制度；C项：“司法独立”不是我国制度的表述方式，均不属中国特色社会主义制度。"},{"ch":6,"t":"m","n":21,"stem":"如何理解党的领导和依法治国的内在统一性（ ）。","o":["要坚持党总揽全局、协调统筹各方工作","党的领导要贯彻到法治建设全过程和各方面","党要加强学习，要努力改善和提高领导法治建设的水平","党治国理政必须依据宪法法律","党要依据党内法规从严治党"],"a":"ABCDE","e":"五项均正确，本题为全选题。"},{"ch":6,"t":"m","n":22,"stem":"下列关于中国特色社会主义法治理论观念的表述，正确的有（ ）","o":["法治是国家治理体系和治理能力的重要依托","中国共产党是依法治国的主体和力量源泉","在特殊情况下,个别人可以逾越法律底线","行政机关要坚持法无授权不可为","只有得到人民的内心拥护和真诚信仰，法律方有权威可言"],"a":"ADE","e":"B项：依法治国的主体和力量源泉是人民，不是中国共产党；C项：任何人不得逾越法律底线。"},{"ch":6,"t":"m","n":23,"stem":"下列关于法律体系中法律的说法正确的是（ ）。","o":["各级人大及其常委会都有权制定法律","法律的制定必须以宪法为依据","行政法规和地方性法规不得与法律相抵触","法律是中国特色社会主义法律体系的主干","法律解决的是国家发展中带有根本性、长期性的问题"],"a":"BCDE","e":"A项：只有全国人大及其常委会有权制定法律，并非“各级人大及其常委会”。"},{"ch":6,"t":"m","n":24,"stem":"司法的基本要求是（ ）","o":["正确","合法","合理","及时","高效"],"a":"ABCD","e":"E项：“高效”不是司法基本要求的四项表述（正确、合法、合理、及时）。"},{"ch":6,"t":"m","n":25,"stem":"下列属于我国宪法确立的基本政治制度是（ ）。","o":["中国共产党领导的多党合作制","中国共产党领导的政治协商制度","民族区域自治制度","基层群众自治制度"],"a":"ABCD","e":"四项均正确，本题为全选题。"},{"ch":6,"t":"m","n":26,"stem":"在我国立法体制中，民族自治地方的人民代表大会有权根据当地特点制定具有约束力的规范性法律文件，这些文件是（ ）。","o":["行政法规","地方法规","地方规章","自治条例","单行条例"],"a":"DE","e":"A、B、C项：行政法规由国务院制定，地方性法规由地方人大制定，地方政府规章由地方政府制定，均非民族自治地方人大制定。"},{"ch":6,"t":"m","n":27,"stem":"根据法律的规范作用的指向和侧重，可以将社会主义法律的规范作用分为（ ）。","o":["指引作用","评价作用","强制作用","教育作用","预测作用"],"a":"ABCDE","e":"五项均正确，本题为全选题。"},{"ch":6,"t":"m","n":28,"stem":"国家机关的立法活动必须遵循的法定程序是（ ）。","o":["法律案的提出","法律案的讨论","法律案的审","法律案的表决","法律的公布"],"a":"ACDE","e":"B项：立法法定程序为提出、审议、表决、公布，“讨论”不是规范表述，应为“审议”。"},{"ch":6,"t":"m","n":29,"stem":"我国司法机关包括（ ）。","o":["人民法院","人民检察院","司法局","公安局","监狱"],"a":"AB","e":"C、D、E项：司法局、公安局属行政机关，监狱属司法行政机关，我国司法机关是人民法院和人民检察院。"},{"ch":6,"t":"m","n":30,"stem":"社会主义法律的本质规定性具有（ ）。","o":["人民性","阶级性","科学性","思想性","先进性"],"a":"ABCE","e":"D项：社会主义法律的本质规定性体现为人民性、阶级性、科学性、先进性，“思想性”不是其表述。"},{"ch":6,"t":"m","n":31,"stem":"决定法律本质、内容和发展方向的根本因素是（ ）。","o":["生产力","生产关系","政治关系","经济关系","阶级关系"],"a":"AB","e":"C、D、E项：决定法律本质、内容和发展方向的根本因素是生产力与生产关系（经济基础），政治关系、经济关系、阶级关系不是根本因素。"},{"ch":6,"t":"j","n":1,"stem":"要实现真正的自由就要摆脱纪律、法律等的束缚。","a":"F"},{"ch":6,"t":"j","n":2,"stem":"任何公民都是享有法律权利和履行法律义务的统一体，并把自己依法履行义务作为他人依法享受权利的实现条件","a":"T"},{"ch":6,"t":"j","n":3,"stem":"法治思维是现代社会成员应当具备的一种思维，与公民的专业和职业有一定的关系。","a":"F"},{"ch":6,"t":"j","n":4,"stem":"立法活动必须遵循法定程序，就全国人民代表大会的立法程序而言，大体包括法律案的提出、法律案的审议、法律案的表决和法律的公布四个环节。","a":"T"},{"ch":6,"t":"j","n":5,"stem":"法律权利的内容、分配和实现方式因社会制度和国家法律的不同而存在差异。","a":"T"},{"ch":6,"t":"j","n":6,"stem":"法治国家要求，法律在社会生活国家生活的一切重要领域处于至高无上的地位，即法律享有崇高的威望，得到普遍的遵守和广泛的认同，法律在调控社会生活方面发挥基础和主导的作用。法律的至高无上的权威是法治国家的显著特征。","a":"T"},{"ch":6,"t":"j","n":7,"stem":"权利决不能超出社会的经济结构以及由经济结构制约的社会的文化发展。","a":"T"},{"ch":6,"t":"j","n":8,"stem":"人权只有符合法律权利保障的精神和要求，才具有正当性和合理性；法律权利只有上升为人权，才能得到有效的尊重和保障。","a":"F"},{"ch":6,"t":"j","n":9,"stem":"只有取得中华人民共和国国籍，并在我国有正当职业和居住1年以上，年满18周岁的公民，才有选举权和被选举权。","a":"F"},{"ch":6,"t":"j","n":10,"stem":"党的领导原则是我国宪法的基本原则之一。","a":"T"},{"ch":6,"t":"j","n":11,"stem":"公民的基本权利与基本义务共同反映和决定着公民在国家中的政治与法律地位，并构成普通法律规定公民权利和义务的基础与原则。","a":"T"},{"ch":6,"t":"j","n":12,"stem":"中国人民共和国公民在年老、疾病或丧失劳动能力的情况下，有从国家和社会获得物质帮助的权利。","a":"T"},{"ch":6,"t":"j","n":13,"stem":"我国兵役法规定，普通高等学校毕业生的征集年龄可以放宽至26岁。","a":"F"},{"ch":6,"t":"j","n":14,"stem":"宪法的核心价值是保障政府权力。","a":"F"},{"ch":6,"t":"j","n":15,"stem":"我国宪法规定，人民行使国家权力的机关是全国人民代表大会。","a":"F"},{"ch":6,"t":"j","n":16,"stem":"法律权威的树立主要依靠法律的外在强制力和内在说服力。","a":"T"},{"ch":6,"t":"j","n":17,"stem":"我国社会主义法律既具有鲜明的阶级性，又具有广泛的人民性，体现了阶级性与人民性的统一。","a":"T"},{"ch":6,"t":"j","n":18,"stem":"法律面前人人平等是指公民在守法、适用法律上一律平等，也包括在立法时也要平等对待每个公民。","a":"F"},{"ch":6,"t":"j","n":19,"stem":"守法，就是指依法履行义务。","a":"F"},{"ch":6,"t":"j","n":20,"stem":"所有的法律规范的实施，均须由国家强制力（国家暴力）强制实施的。","a":"F"},{"ch":6,"t":"j","n":21,"stem":"具有强制力的行为规范就是法律。","a":"F"},{"ch":6,"t":"j","n":22,"stem":"法是随着私有制、阶级和国家的产生而产生。","a":"T"},{"ch":6,"t":"j","n":23,"stem":"社会主义法律是全民意志的体现。","a":"F"},{"ch":6,"t":"j","n":24,"stem":"社会主义法是阶级性和人民性的统一，所以不调整阶级对立关系。","a":"F"},{"ch":6,"t":"j","n":25,"stem":"一个法律规范就是一个法律条文。","a":"F"},{"ch":6,"t":"j","n":26,"stem":"人民民主专政是我国的政权组织形式。","a":"F"},{"ch":6,"t":"j","n":27,"stem":"我国宪法修改案必须有全国人大全体代表的1/2多数通过。","a":"F"},{"ch":6,"t":"e","n":1,"stem":"材料一\n2023年8月28日，《中华人民共和国治安管理处罚法（修订草案）》提请十四届全国人大常委会第五次会议审议，随后全国人大常委会在人大网上公布该修订草案，并向社会公众公开征求意见。此次修订草案对多个社会治安领域的热点问题进行了规定。草案增列数种应予处罚的行为，包括考试作弊、高空抛物、违法出售或者提供公民个人信息等。同时，修订草案将治安管理工作中一些好的机制和做法通过法律形式予以确认，进一步合理设定了处罚措施和幅度。例如，被处罚人不服行政拘留处罚决定、提起行政诉讼的，或者遇有参加升学考试、近亲属病危、死亡等情形的，可以提出暂缓执行行政拘留的申请，满足法定条件的，公安机关可暂缓执行行政拘留处罚决定。\n请结合材料，运用《思想道德与法治》的相关知识，分析《治安管理处罚法》的修订对建设法治中国的意义。","k":["公开征求意见体现科学立法、民主立法原则，拓宽公民有序参与立法渠道。","有利于推进全面依法治国，完善中国特色社会主义法律体系，为法治中国建设提供法律保障。","有利于规范政府及其工作人员的执法行为，促进依法行政、建设法治政府。","有利于保障公民合法权益，增强公民法治意识，促进自觉守法。","有利于推进社会治理体系和治理能力现代化，维护社会和谐稳定。"]},{"ch":6,"t":"e","n":2,"stem":"材料二\n数字时代，算法推荐技术极大地提升了信息获取的效率和个性化体验，但“信息茧房”“大数据杀熟”、算法歧视等问题也日益引发社会担忧。为规范算法应用，中国在法治轨道上迈出了关键一步。\n2022年3月1日，国家互联网信息办公室、工业和信息化部、公安部、国家市场监督管理总局联合发布的 《互联网信息服务算法推荐管理规定》（以下简称《规定》）正式施行。这是全球范围内，针对算法推荐技术进行的较早、较为全面的专项立法之一。《规定》明确要求：保障用户的知情权和选择权，要求向用户提供不针对其个人特征的选项，或者便捷的关闭算法推荐服务的选项；不得实施大数据杀熟等违法活动，要求根据消费者的偏好、交易习惯等特征，在交易价格等交易条件上实行不合理的差别待遇；应当建立完善用于未成年人、老年人、劳动者、消费者等主体权益的保护机制；鼓励算法公开透明，并建立健全人工干预和用户自主选择机制。\n该《规定》的出台，旨在规范互联网信息服务中的算法推荐活动，弘扬社会主义核心价值观，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，促进互联网信息服务健康有序发展。”\n（材料出处：中华人民共和国国家互联网信息办公室官网。原文标题：《互联网信息服务算法推荐管理规定》答记者问，以及《规定》正式文本。发布日期：2022年1月4日。链接：http://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm）\n问题：\n1.结合材料，分析《互联网信息服务算法推荐管理规定》的出台体现了我国社会主义法治的哪些基本原则？（至少答出三点）\n2.作为新时代的大学生，我们应如何提升自身的法治素养，积极适应并推动数字时代的法治建设？","k":["权利保障原则：保障用户知情权、选择权，特别保护未成年人、老年人、劳动者、消费者等群体。","公平正义原则：禁止“大数据杀熟”等算法价格歧视，不得实行不合理差别待遇。","权力制约原则：对算法这一新型技术权力进行法律规制，要求公开透明、可人工干预，防止滥用。","提升法治素养：学习《网络安全法》《数据安全法》《个人信息保护法》等，做尊法学法的表率。","培养法治思维：警惕“信息茧房”和算法操纵，对侵权行为依法维权，做守法用法的先锋。","参与普法宣传：向家人朋友普及数字法治常识，做法治文化的传播者。"]}]};
</script>
<script>
/* ===== 思想道德与法治 · 2026 秋 题库 App ===== */
(function () {
  var DATA = window.__BANK__;
  var ITEMS = DATA.items, CHS = DATA.chapters;

  var TYPE = { s: '单项选择', m: '多项选择', j: '判断', e: '材料分析' };
  var TKEY = ['A', 'B', 'C', 'D', 'E'];
  var INT = [1, 2, 4, 7];            // 艾宾浩斯四轮间隔（天）
  var MASTER_ST = 4;                  // 连续答对 4 轮即视为掌握
  var TARGET = '2026-12-31';          // 完全掌握截止日
  var KEY = 'df2026.bank.v1';

  var state = {
    cards: {}, fav: {}, daily: {}, lastDay: '',
    filterCh: 'all', filterType: 'all', mode: 'plan',
    queue: [], idx: 0, answer: [], submitted: false, revealed: false,
    autoNext: false, started: today()
  };

  /* ---------- 工具 ---------- */
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function addDays(str, n) {
    var d = new Date(str + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function diffDays(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ cards: state.cards, fav: state.fav, daily: state.daily, lastDay: state.lastDay, autoNext: state.autoNext, cur: curId() })); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      state.cards = o.cards || {};
      state.fav = o.fav || {};
      state.daily = o.daily || {};
      state.lastDay = o.lastDay || '';
      state.autoNext = !!o.autoNext;
      state._restore = o.cur;
    } catch (e) {}
  }

  /* ---------- 学习记录 ---------- */
  function card(id) {
    if (!state.cards[id]) state.cards[id] = { st: 0, due: '', seen: 0, ok: 0, no: 0, sk: 0, last: '' };
    return state.cards[id];
  }
  function isDue(id) {
    var c = state.cards[id];
    return c && c.seen > 0 && c.due && c.due <= today() && c.st < MASTER_ST;
  }
  function isNew(id) { return !state.cards[id] || !state.cards[id].seen; }
  function isWrong(id) {
    var c = state.cards[id];
    return c && c.no > 0 && c.sk < 2;
  }
  function mastered(id) {
    var c = state.cards[id];
    return c && c.st >= MASTER_ST;
  }

  function dueCount() { var n = 0; ITEMS.forEach(function (_, i) { if (isDue(i)) n++; }); return n; }
  function newCount() { var n = 0; ITEMS.forEach(function (_, i) { if (isNew(i)) n++; }); return n; }

  function planEnd() { return addDays(TARGET, -14); }
  function newQuota() {
    var left = newCount();
    if (!left) return 0;
    var days = Math.max(1, diffDays(today(), planEnd()) + 1);
    var q = Math.ceil(left / days);
    return Math.max(1, q);
  }

  /* ---------- 队列 ---------- */
  function passesFilter(i) {
    if (state.filterCh !== 'all' && ITEMS[i].ch !== +state.filterCh) return false;
    if (state.filterType !== 'all' && ITEMS[i].t !== state.filterType) return false;
    return true;
  }
  function buildQueue() {
    var q = [];
    if (state.mode === 'plan') {
      var due = [], fresh = [];
      ITEMS.forEach(function (it, i) {
        if (!passesFilter(i)) return;
        if (isDue(i)) due.push(i);
        else if (isNew(i)) fresh.push(i);
      });
      due.sort(function (a, b) { return (state.cards[a].due || '').localeCompare(state.cards[b].due || '') || a - b; });
      q = due.concat(fresh.slice(0, newQuota()));
    } else if (state.mode === 'review') {
      ITEMS.forEach(function (it, i) { if (passesFilter(i) && isDue(i)) q.push(i); });
      q.sort(function (a, b) { return (state.cards[a].due || '').localeCompare(state.cards[b].due || '') || a - b; });
    } else if (state.mode === 'wrong') {
      ITEMS.forEach(function (it, i) { if (passesFilter(i) && isWrong(i)) q.push(i); });
    } else if (state.mode === 'fav') {
      ITEMS.forEach(function (it, i) { if (passesFilter(i) && state.fav[i]) q.push(i); });
    } else {
      ITEMS.forEach(function (it, i) { if (passesFilter(i)) q.push(i); });
    }
    state.queue = q;
    if (!q.length) { state.idx = 0; return; }
    if (state._restore != null) {
      var at = q.indexOf(state._restore);
      state.idx = at >= 0 ? at : 0;
      state._restore = null;
    } else if (state.idx >= q.length) state.idx = 0;
  }
  function curId() { return state.queue.length ? state.queue[state.idx] : null; }
  function item() { var id = curId(); return id == null ? null : ITEMS[id]; }

  /* ---------- 判分 ---------- */
  function letters(i) { return TKEY[i]; }
  function answerOf(it) { return it.a || ''; }
  function judge(it, ans) {
    if (it.t === 'm') {
      var a = ans.slice().sort().join(''), b = answerOf(it).split('').sort().join('');
      return a === b;
    }
    return ans[0] === answerOf(it);
  }
  function record(it, correct, id) {
    var c = card(id);
    c.seen++;
    c.last = today();
    if (correct) {
      c.ok++; c.sk++;
      c.st = Math.min(MASTER_ST, c.st + 1);
      if (c.st >= MASTER_ST) { c.due = ''; }
      else {
        var due0 = addDays(today(), INT[Math.min(c.st - 1, INT.length - 1)]);
        c.due = due0 > TARGET ? TARGET : due0;
      }
    } else {
      c.no++; c.sk = 0;
      c.st = Math.max(0, c.st - 2);
      c.due = addDays(today(), 1);
    }
    var d = state.daily[today()] || { done: 0, ok: 0 };
    d.done++; if (correct) d.ok++;
    state.daily[today()] = d;
    state.lastDay = today();
    save();
  }

  /* ---------- 渲染：侧栏 ---------- */
  function chName(i) { return CHS[i].replace(/^第[一二三四五六]章\s*/, '').replace(/^绪论\s*/, '绪论·'); }
  function renderRail() {
    var dueN = dueCount(), newN = newCount(), quota = newQuota();
    var d0 = state.daily[today()] || (state.daily[today()] = { done: 0, ok: 0 });
    if (!d0.goal) d0.goal = dueN + quota;
    var doneToday = d0.done || 0;
    var targetToday = d0.goal;
    var pct = targetToday ? Math.min(100, Math.round(doneToday / targetToday * 100)) : 0;
    var dash = 2 * Math.PI * 26;
    var ell = document.getElementById('ringArc');
    ell.setAttribute('stroke-dasharray', dash.toFixed(1));
    ell.setAttribute('stroke-dashoffset', (dash * (1 - pct / 100)).toFixed(1));
    document.getElementById('ringPct').textContent = pct + '%';

    var masteredN = 0;
    ITEMS.forEach(function (_, i) { if (mastered(i)) masteredN++; });
    document.getElementById('todayNums').innerHTML =
      '<div>今日新题 <b>' + Math.min(quota, newN) + '</b> 题　复习 <b>' + dueN + '</b> 题</div>' +
      '<div>已掌握 <b>' + masteredN + '</b> / ' + ITEMS.length + '　已完成 <b>' + doneToday + '</b></div>';

    var streak = 0;
    for (var k = 0; k < 400; k++) {
      var d = addDays(today(), -k);
      if (state.daily[d] && state.daily[d].done > 0) streak++;
      else if (k > 0) break;
    }
    document.getElementById('streak').innerHTML = '<span class="dot"></span>连续学习 ' + streak + ' 天 · 截止 ' + TARGET.slice(5).replace('-', '/');

    var chBox = document.getElementById('chapters');
    chBox.innerHTML = '';
    var allBtn = document.createElement('button');
    allBtn.className = 'nav-item' + (state.filterCh === 'all' ? ' on' : '');
    allBtn.innerHTML = '<span>全部章节</span><span class="cnt">' + ITEMS.length + '</span>';
    allBtn.onclick = function () { state.filterCh = 'all'; resetQueue(); };
    chBox.appendChild(allBtn);
    CHS.forEach(function (name, i) {
      var total = 0, done = 0;
      ITEMS.forEach(function (it, j) { if (it.ch === i) { total++; if (state.cards[j] && state.cards[j].seen) done++; } });
      var b = document.createElement('button');
      b.className = 'nav-item' + (state.filterCh === String(i) ? ' on' : '');
      b.innerHTML = '<span>' + chName(i) + '</span><span class="cnt">' + done + '/' + total + '</span>' +
        '<span class="mini"><i style="width:' + (total ? done / total * 100 : 0) + '%"></i></span>';
      b.onclick = function () { state.filterCh = String(i); resetQueue(); };
      chBox.appendChild(b);
    });

    ['all', 's', 'm', 'j', 'e'].forEach(function (t) {
      var b = document.querySelector('[data-type="' + t + '"]');
      if (b) b.classList.toggle('on', state.filterType === t);
    });
    ['plan', 'free', 'review', 'wrong', 'fav'].forEach(function (m) {
      var b = document.querySelector('[data-mode="' + m + '"]');
      if (b) b.classList.toggle('on', state.mode === m);
    });
    var mp = document.getElementById('modePill');
    if (mp) mp.textContent = ({ plan: '今日计划', free: '自由练习', review: '到期复习', wrong: '错题重练', fav: '我的收藏' })[state.mode] + ' · ' + (state.filterType === 'all' ? '全部题型' : TYPE[state.filterType]) + ' · ' + (state.filterCh === 'all' ? '全部章节' : chName(+state.filterCh));
    var w = 0; ITEMS.forEach(function (_, i) { if (isWrong(i)) w++; });
    var el = document.getElementById('wrongCnt'); if (el) el.textContent = w;
    var f = Object.keys(state.fav).filter(function (k) { return state.fav[k]; }).length;
    var fe = document.getElementById('favCnt'); if (fe) fe.textContent = f;
    document.getElementById('dueCnt').textContent = dueN;
  }

  function resetQueue() {
    state.idx = 0;
    buildQueue();
    renderAll();
    save();
  }

  /* ---------- 渲染：题目 ---------- */
  function renderQuestion() {
    var box = document.getElementById('qbox');
    var it = item();
    if (!it) {
      box.innerHTML = '<div class="empty"><h2>这里暂时没有题</h2><p>' + emptyHint() + '</p>' +
        '<button class="btn primary" onclick="App.switchMode(\'free\')">进入自由练习</button></div>';
      renderDock();
      return;
    }
    var id = curId();
    var type = it.t;
    var ans = state.answer;
    var sub = state.submitted;
    var right = sub ? judge(it, ans) : false;
    var html = '';

    html += '<div class="qmeta"><span class="chip ' + type + '">' + TYPE[type] + '</span>' +
      '<span class="no">' + chName(it.ch) + ' · 第 ' + it.n + ' 题</span></div>';
    html += '<div class="stem">' + esc(it.stem) + '</div>';

    if (type === 'j') {
      html += '<div class="truefalse">';
      [['T', '正确'], ['F', '错误']].forEach(function (p) {
        var cls = 'tf';
        if (sub) {
          if (p[0] === answerOf(it)) cls += ' right';
          else if (ans[0] === p[0]) cls += ' wrong';
        } else if (ans[0] === p[0]) cls += ' sel';
        html += '<button class="' + cls + '" data-tf="' + p[0] + '">' + p[1] + '</button>';
      });
      html += '</div>';
    } else if (type === 's' || type === 'm') {
      html += '<div class="opts">';
      it.o.forEach(function (o, i) {
        var cls = 'opt';
        var flag = '';
        if (sub) {
          var isAns = answerOf(it).indexOf(letters(i)) >= 0;
          var picked = ans.indexOf(letters(i)) >= 0;
          if (isAns && picked) { cls += ' right'; flag = '正确'; }
          else if (!isAns && picked) { cls += ' wrong'; flag = '错选'; }
          else if (isAns && !picked) { cls += ' missed'; flag = '漏选'; }
        } else if (ans.indexOf(letters(i)) >= 0) cls += ' sel';
        html += '<button class="' + cls + '" data-opt="' + letters(i) + '">' +
          '<span class="key">' + letters(i) + '</span><span class="txt">' + esc(o) + '</span>' +
          (flag ? '<span class="flag">' + flag + '</span>' : '') + '</button>';
      });
      html += '</div>';
    }

    if (sub) {
      if (type === 'e') {
        /* 材料题不判分 */
      } else {
        html += '<div class="verdict ' + (right ? 'ok' : 'no') + '"><span class="mark">' + (right ? '✓' : '✕') + '</span>' +
          '<div class="body">' + (right ? '回答正确' : '回答错误') +
          '　你的答案 <b>' + (ans.join('') || '—') + '</b>　参考答案 <span class="ans">' + answerOf(it) + '</span>' +
          (type === 'm' ? '<div style="font-size:12px;margin-top:4px;color:inherit;opacity:.8">多选题需与参考答案完全一致才计分</div>' : '') +
          '</div></div>';
      }
    }

    if (type === 'e') {
      html += '<div class="selfcheck"><button class="btn primary" id="btnKey">' + (state.revealed ? '收起要点' : '查看答题要点') + '</button></div>';
      if (state.revealed) {
        html += '<div class="keypoints"><div class="lab">答题要点（要点覆盖即可得分）</div><ul>' +
          it.k.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
          '<div class="selfcheck"><button class="btn" data-self="1">我已答出要点</button><button class="btn" data-self="0">还需再练</button></div></div>';
      }
    }

    if (sub && type !== 'e') {
      var extra = '';
      if (type === 'm' && it.e) extra = '<div class="exp"><span class="lab">错项解析</span><br>' + esc(it.e) + '</div>';
      if (type === 's') {
        var correctText = it.o[answerOf(it).charCodeAt(0) - 65];
        extra = '<div class="exp"><span class="lab">正确选项</span><br>' + letters(answerOf(it).charCodeAt(0) - 65) + '. ' + esc(correctText || '') + '</div>';
      }
      if (type === 'j') {
        extra = '<div class="exp"><span class="lab">依据</span><br>本题表述' + (answerOf(it) === 'T' ? '正确' : '错误') +
          (answerOf(it) === 'F' ? '。判断题中凡出现“只要…就”“完全”“唯一”“等于”等绝对化表述，或与教材定义相悖，一般为错误。' : '，与教材表述一致。') + '</div>';
      }
      if (extra) html += '<div class="analysis">' + extra + '</div>';
    }

    box.innerHTML = '<div class="qcard">' + html + '</div>';
    renderDock();
    bindQuestion();

    if (sub) {
      var v = box.querySelector('.verdict');
      if (v && !right && state.autoNext) setTimeout(next, 1400);
    }
  }

  function emptyHint() {
    if (state.mode === 'plan') return '今日计划已完成。可以去“错题重练”巩固薄弱题，或切换到自由练习继续推进。';
    if (state.mode === 'wrong') return '当前筛选下没有待攻克的错题。答对两次的题会自动移出错题本。';
    if (state.mode === 'fav') return '还没有收藏题目，点题目右下角的 ☆ 即可收藏。';
    if (state.mode === 'review') return '当前没有到期需要复习的题。';
    return '当前筛选条件下没有题目，试试切换章节或题型。';
  }

  function bindQuestion() {
    var box = document.getElementById('qbox');
    box.querySelectorAll('[data-opt]').forEach(function (b) {
      b.onclick = function () { pick(b.getAttribute('data-opt')); };
    });
    box.querySelectorAll('[data-tf]').forEach(function (b) {
      b.onclick = function () { pick(b.getAttribute('data-tf')); };
    });
    var bk = document.getElementById('btnKey');
    if (bk) bk.onclick = function () { state.revealed = !state.revealed; renderQuestion(); };
    box.querySelectorAll('[data-self]').forEach(function (b) {
      b.onclick = function () {
        var ok = b.getAttribute('data-self') === '1';
        record(item(), ok, curId());
        state.revealed = false;
        state.submitted = true;
        renderAll();
        if (state.autoNext) setTimeout(next, 900);
      };
    });
  }

  function pick(key) {
    var it = item();
    if (!it || state.submitted) return;
    if (it.t === 'm') {
      var i = state.answer.indexOf(key);
      if (i >= 0) state.answer.splice(i, 1); else state.answer.push(key);
      renderQuestion();
      return;
    }
    state.answer = [key];
    state.submitted = true;
    record(it, judge(it, state.answer), curId());
    renderAll();
    if (state.autoNext) setTimeout(next, 1000);
  }

  function submit() {
    var it = item();
    if (!it || state.submitted) return;
    if (!state.answer.length) { toast('请先选择选项'); return; }
    state.submitted = true;
    record(it, judge(it, state.answer), curId());
    renderAll();
    if (state.autoNext) setTimeout(next, 1200);
  }

  function next() {
    if (state.idx + 1 < state.queue.length) {
      state.idx++;
      resetAnswer();
      renderAll();
    } else {
      toast('本轮已完成，可查看答题卡或切换模式');
    }
  }
  function prev() {
    if (state.idx > 0) { state.idx--; resetAnswer(); renderAll(); }
  }
  function resetAnswer() { state.answer = []; state.submitted = false; state.revealed = false; }
  function goto(n) {
    var id = state.queue[n];
    if (id == null) return;
    state.idx = n; resetAnswer(); renderAll();
  }

  /* ---------- 渲染：底部 ---------- */
  function renderDock() {
    var total = state.queue.length;
    var done = 0;
    state.queue.forEach(function (id) { if (state.cards[id] && state.cards[id].seen) done++; });
    document.getElementById('dockProg').innerHTML = '本轮进度 <b>' + (total ? state.idx + 1 : 0) + '</b> / ' + total +
      '　已作答 ' + done + '<div class="bar"><i style="width:' + (total ? done / total * 100 : 0) + '%"></i></div>';
    var sub = document.getElementById('btnSubmit');
    var it = item();
    sub.style.display = it && it.t === 'm' && !state.submitted && it.t !== 'e' ? '' : 'none';
    var st = document.getElementById('btnSelf');
    st.style.display = it && it.t === 'e' ? '' : 'none';
    document.getElementById('btnPrev').disabled = state.idx === 0;
    document.getElementById('btnNext').textContent = state.idx + 1 >= state.queue.length ? '完成' : '下一题';
    var fav = document.getElementById('btnFav');
    fav.classList.toggle('on', !!(it && state.fav[curId()]));
    fav.textContent = it && state.fav[curId()] ? '★' : '☆';
  }

  /* ---------- 渲染：答题卡 ---------- */
  function renderSheet() {
    var box = document.getElementById('sheetGrid');
    box.innerHTML = '';
    var html = '';
    state.queue.forEach(function (id, i) {
      var c = state.cards[id];
      var cls = '';
      if (c && c.seen) cls = (c.sk === 0 && c.no > 0) ? 'bad' : 'done';
      if (i === state.idx) cls += ' cur';
      html += '<button class="' + cls + '" data-goto="' + i + '">' + (i + 1) + '</button>';
    });
    box.innerHTML = html;
    box.querySelectorAll('[data-goto]').forEach(function (b) {
      b.onclick = function () { goto(+b.getAttribute('data-goto')); closeSheet(); };
    });
  }

  /* ---------- 视图：统计 ---------- */
  function renderStats() {
    var seen = 0, ok = 0, no = 0, mN = 0, s0 = 0;
    var dist = [0, 0, 0, 0, 0];
    ITEMS.forEach(function (_, i) {
      var c = state.cards[i];
      if (c && c.seen) { seen++; ok += c.ok; no += c.no; dist[Math.min(c.st, MASTER_ST)]++; if (c.st >= MASTER_ST) mN++; }
      else s0++;
    });
    var acc = ok + no ? Math.round(ok / (ok + no) * 100) : 0;
    var daysLeft = diffDays(today(), TARGET);
    var need = ITEMS.length - mN;
    var perDay = daysLeft > 0 ? Math.ceil(need / daysLeft) : need;

    var h = '<div class="cards">' +
      cardHtml('已学习', seen + ' / ' + ITEMS.length, '覆盖率 ' + Math.round(seen / ITEMS.length * 100) + '%') +
      cardHtml('完全掌握', mN, '连对 4 轮 / 4 轮') +
      cardHtml('累计正确率', acc + '%', ok + ' 对 · ' + no + ' 错') +
      cardHtml('距 12/31', daysLeft + ' 天', '每天需掌握 ' + perDay + ' 题') +
      '</div>';

    h += '<div class="panel"><h3>掌握阶段分布（艾宾浩斯 4 轮）</h3><div class="stages">';
    ['未学', '答对1轮', '答对2轮', '答对3轮', '已掌握'].forEach(function (t, i) {
      h += '<div class="stage-chip"><b>' + dist[i] + '</b><span>' + t + '</span></div>';
    });
    h += '</div><div class="note" style="margin-top:14px">复习间隔为 1 → 2 → 4 → 7 天，连对 4 轮即视为掌握（约 14 天）。答对升一轮并顺延下次；答错退回两轮、次日重练，答错即重新开始累计连对。</div></div>';

    h += '<div class="panel"><h3>各章进度</h3>';
    CHS.forEach(function (name, ci) {
      var total = 0, d = 0, mm = 0;
      ITEMS.forEach(function (it, i) { if (it.ch === ci) { total++; if (state.cards[i] && state.cards[i].seen) d++; if (mastered(i)) mm++; } });
      h += '<div class="rowbar"><span>' + chName(ci) + '</span><span class="t"><i style="width:' + (total ? d / total * 100 : 0) + '%"></i></span><span class="n">' + d + '/' + total + '</span></div>';
    });
    h += '</div>';

    var up = [0, 0, 0, 0, 0, 0, 0];
    ITEMS.forEach(function (_, i) {
      var c = state.cards[i];
      if (c && c.seen && c.st < MASTER_ST && c.due) {
        var dd = diffDays(today(), c.due);
        if (dd >= 0 && dd < 7) up[dd]++;
      }
    });
    h += '<div class="panel"><h3>未来 7 天到期复习</h3>';
    for (var i = 0; i < 7; i++) {
      var dstr = addDays(today(), i);
      h += '<div class="rowbar"><span>' + (i === 0 ? '今天' : dstr.slice(5)) + '</span><span class="t"><i style="width:' + Math.min(100, up[i] / 60 * 100) + '%"></i></span><span class="n">' + up[i] + ' 题</span></div>';
    }
    h += '</div>';

    h += '<div class="panel"><h3>本周学习安排建议</h3><table class="plan-table"><tr><th>日期</th><th>新题</th><th>复习</th><th>累计覆盖</th></tr>';
    var cover = seen, proj = cover;
    for (var k = 0; k < 7; k++) {
      var day = addDays(today(), k);
      proj = Math.min(ITEMS.length, proj + Math.min(newQuota(), ITEMS.length - proj));
      h += '<tr><td>' + day.slice(5) + '</td><td class="n">' + Math.min(newQuota(), Math.max(0, ITEMS.length - cover)) + '</td><td class="n">≈' + Math.round(up[k] || 0) + '</td><td class="n">' + proj + '</td></tr>';
    }
    h += '</table><div class="note" style="margin-top:12px">计划按“每天新题 = 剩余未学题 ÷ 剩余天数（预留考前 7 天纯复习）”自动计算。今天的新题配额为 <b>' + newQuota() + '</b> 题。</div></div>';

    document.getElementById('statsBox').innerHTML = h;
  }
  function cardHtml(k, v, s) {
    return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  }

  /* ---------- 主渲染 ---------- */
  function renderAll() {
    renderRail();
    if (location.hash === '#stats') { renderStats(); return; }
    renderQuestion();
    renderSheet();
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2000);
  }

  /* ---------- 抽屉 ---------- */
  function openSheet() {
    document.getElementById('sheet').classList.add('on');
    document.getElementById('sheetMask').classList.add('on');
    document.getElementById('rail').classList.remove('on');
  }
  function closeSheet() {
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('sheetMask').classList.remove('on');
  }

  /* ---------- 导出 ---------- */
  function exportData() {
    var blob = new Blob([JSON.stringify({ cards: state.cards, fav: state.fav, daily: state.daily }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '德法题库学习进度.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  }
  function importData(text) {
    try {
      var o = JSON.parse(text);
      if (!o.cards) throw 0;
      state.cards = o.cards; state.fav = o.fav || {}; state.daily = o.daily || {};
      save(); resetQueue(); toast('进度已导入');
    } catch (e) { toast('文件格式不对'); }

    });
  }

  /* ---------- 离线通行证 ---------- */
  function showOffline(show) {
    var box = document.getElementById('gate-off');
    if (!box) return;
    box.style.display = show ? '' : 'none';
    var dev = document.getElementById('gate-dev');
    if (dev) dev.textContent = deviceCode();
  }

  function verifyPass(passText) {
    var parts = String(passText || '').trim().split('.');
    if (parts.length !== 2) return Promise.reject(new Error('通行证格式不对，请整串复制'));
    var payloadStr, sig, dev = deviceCode();
    try {
      payloadStr = new TextDecoder('utf-8').decode(b64urlBytes(parts[0]));
      sig = b64urlBytes(parts[1]);
    } catch (e) { return Promise.reject(new Error('通行证内容无法解析')); }

    var payload;
    try { payload = JSON.parse(payloadStr); } catch (e) { return Promise.reject(new Error('通行证内容无法解析')); }
    if (norm(payload.d) !== norm(dev)) return Promise.reject(new Error('这张通行证是给别的设备的，本机设备码是 ' + dev));

    if (typeof crypto === 'undefined' || !crypto.subtle) {
      return Promise.reject(new Error('当前浏览器不支持离线验签，请换 Chrome/Edge 或换手机流量在线校验'));
    }
    return crypto.subtle.importKey('spki', b64urlBytes(CFG.pubkey), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify'])
      .then(function (key) {
        return crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, new TextEncoder().encode(payloadStr));
      })
      .then(function (ok) {
        if (!ok) throw new Error('通行证签名无效，请让发放人重新签发');
        if (payload.e && Date.now() > payload.e) throw new Error('通行证已过期，请让发放人重新签发');
        return payload;
      });
  }

  function boot() {
    if (tokenOK()) { document.body.classList.remove('gate-lock'); return; }
    document.body.classList.add('gate-lock');
    inject();
    var input = document.getElementById('gate-input');
    var form = document.getElementById('gate-form');
    input.addEventListener('input', function () {
      var pos = input.selectionStart;
      input.value = fmtCode(input.value);
      try { input.setSelectionRange(pos, pos); } catch (e) {}
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      submit(input.value);
    });

    document.getElementById('gate-offlink').addEventListener('click', function () { showOffline(true); });
    document.getElementById('gate-devcopy').addEventListener('click', function () {
      var dev = document.getElementById('gate-dev').textContent;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(dev);
        else {
          var ta = document.createElement('textarea');
          ta.value = dev; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
        }
        setMsg('设备码已复制', true);
      } catch (e) { setMsg('复制失败，请手动选中 ' + dev); }
    });
    document.getElementById('gate-use-pass').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      setMsg('正在验证通行证…', true);
      verifyPass(document.getElementById('gate-pass').value).then(function (payload) {
        saveToken('offline-' + norm(deviceCode()), false, payload.e || 0);
        setMsg('通行证有效，正在进入…', true);
        setTimeout(unlock, 240);
      }).catch(function (err) {
        setMsg(err && err.message ? err.message : '通行证无效');
        btn.disabled = false;
      });
    });

    setTimeout(function () { try { input.focus(); } catch (e) {} }, 60);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
  window.__gateSha256 = sha256Hex;   // 便于离线自测
  window.__gateVerifyPass = verifyPass;
})();

/* __GATE_END__ */</script>
